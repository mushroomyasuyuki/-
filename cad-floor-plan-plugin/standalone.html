<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAD Floor Plan 3D Simulator - Standalone</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #09090b;
      color: #f4f4f5;
      padding: 20px;
      line-height: 1.6;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #27272a;
      padding-bottom: 20px;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #fff;
    }

    .header p {
      color: #d4d4d8;
      font-size: 15px;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .panel {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 20px;
    }

    .panel h2 {
      color: #fff;
      margin-bottom: 15px;
      font-size: 18px;
      border-bottom: 2px solid #27272a;
      padding-bottom: 10px;
    }

    .file-input-wrapper {
      background: #09090b;
      border: 2px dashed #3b82f6;
      border-radius: 8px;
      padding: 30px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      margin-bottom: 15px;
    }

    .file-input-wrapper:hover {
      border-color: #60a5fa;
      background: #0f172a;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .file-input-label {
      display: block;
      font-weight: 700;
      color: #60a5fa;
      font-size: 16px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .file-info {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.8;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #27272a;
      font-size: 14px;
    }

    .info-item:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #a1a1aa;
      font-weight: 600;
    }

    .info-value {
      color: #fff;
      font-weight: 700;
    }

    #three-container {
      width: 100%;
      height: 600px;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 8px;
      overflow: hidden;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      background: #3b82f6;
      color: #fff;
      border: 1px solid #2563eb;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }

    button:hover:not(:disabled) {
      background: #2563eb;
      border-color: #1d4ed8;
    }

    button:disabled {
      background: #6b7280;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-secondary {
      background: #27272a;
      color: #fff;
      border: 1px solid #3f3f46;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #3f3f46;
      border-color: #60a5fa;
    }

    .status {
      padding: 12px 15px;
      border-radius: 6px;
      margin: 15px 0;
      display: none;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #064e3b;
      border: 1px solid #059669;
      color: #86efac;
    }

    .status.error {
      background: #7f1d1d;
      border: 1px solid #991b1b;
      color: #fca5a5;
    }

    .status.loading {
      background: #1f2937;
      border: 1px solid #4b5563;
      color: #e5e7eb;
    }

    .footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #27272a;
      color: #a1a1aa;
      font-size: 12px;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }

      #three-container {
        height: 400px;
      }

      .header h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🏗️ CAD Floor Plan 3D Simulator</h1>
      <p>DXF / PDF / JSON 形式のCADデータをリアルタイム3D表示</p>
    </div>

    <div class="content">
      <!-- Left Panel: Input & Info -->
      <div class="panel">
        <h2>📋 ファイル入力</h2>

        <div class="file-input-wrapper" id="file-input-area">
          <label class="file-input-label">ドラッグ&ドロップまたはクリック</label>
          <input type="file" id="file-input" accept=".dxf,.pdf,.json">
          <div class="file-info">
            対応形式: DXF / PDF（ベクター） / JSON<br>
            最大サイズ: 10MB
          </div>
        </div>

        <div class="status" id="status"></div>

        <h2 style="margin-top: 20px;">📊 ファイル情報</h2>
        <div class="info-item">
          <span class="info-label">ファイル名</span>
          <span class="info-value" id="filename">未選択</span>
        </div>
        <div class="info-item">
          <span class="info-label">床面積</span>
          <span class="info-value" id="floor-area">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">壁面積</span>
          <span class="info-value" id="wall-area">-</span>
        </div>
        <div class="info-item">
          <span class="info-label">部屋数</span>
          <span class="info-value" id="room-count">0</span>
        </div>

        <div class="controls">
          <button onclick="loadSample()">🎯 サンプル</button>
          <button class="btn-secondary" onclick="resetCamera()" id="btn-reset" disabled>
            🎥 リセット
          </button>
          <button class="btn-secondary" onclick="downloadJSON()" id="btn-download" disabled>
            💾 保存
          </button>
        </div>
      </div>

      <!-- Right Panel: 3D Viewer -->
      <div class="panel">
        <h2>🎨 3D プレビュー</h2>
        <div id="three-container"></div>
      </div>
    </div>

    <div class="footer">
      <p>CAD Floor Plan 3D Simulator v1.0.0 |
        <a href="https://github.com/mushroomyasuyuki/cad-floor-plan-simulator" style="color: #60a5fa; text-decoration: none;">GitHub</a>
      </p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="assets/js/cad-parser.js"></script>
  <script src="assets/js/three-room-renderer.js"></script>

  <script>
    let renderer = null;
    let currentData = null;

    // Initialize
    function init() {
      setupDragDrop();
      setupFileInput();
      setupControls();
      loadSample();
    }

    function setupDragDrop() {
      const area = document.getElementById('file-input-area');

      area.addEventListener('dragover', (e) => {
        e.preventDefault();
        area.style.borderColor = '#60a5fa';
        area.style.background = '#0f172a';
      });

      area.addEventListener('dragleave', () => {
        area.style.borderColor = '#3b82f6';
        area.style.background = '#09090b';
      });

      area.addEventListener('drop', (e) => {
        e.preventDefault();
        area.style.borderColor = '#3b82f6';
        area.style.background = '#09090b';

        const file = e.dataTransfer.files[0];
        if (file) {
          handleFile(file);
        }
      });

      area.addEventListener('click', () => {
        document.getElementById('file-input').click();
      });
    }

    function setupFileInput() {
      document.getElementById('file-input').addEventListener('change', (e) => {
        if (e.target.files[0]) {
          handleFile(e.target.files[0]);
        }
      });
    }

    function setupControls() {
      // Already setup via onclick attributes
    }

    async function handleFile(file) {
      try {
        showStatus('ファイルを読み込んでいます...', 'loading');

        document.getElementById('filename').textContent = file.name;

        currentData = await CADParser.parseFloorPlan(file);
        CADParser.validate(currentData);

        if (!renderer) {
          const container = document.getElementById('three-container');
          renderer = new ThreeRoomRenderer(container, {
            width: container.offsetWidth,
            height: container.offsetHeight,
            backgroundColor: 0x09090b
          });
        }

        renderer.loadFloorPlan(currentData);
        const areas = renderer.getAreas();

        document.getElementById('floor-area').textContent = areas.floorArea + ' m²';
        document.getElementById('wall-area').textContent = areas.wallArea + ' m²';
        document.getElementById('room-count').textContent = currentData.rooms.length;

        document.getElementById('btn-reset').disabled = false;
        document.getElementById('btn-download').disabled = false;

        showStatus('✅ ファイルを読み込みました！', 'success');
      } catch (error) {
        showStatus('❌ エラー: ' + error.message, 'error');
        console.error(error);
      }
    }

    function loadSample() {
      const sampleData = {
        rooms: [{
          id: "room_1",
          vertices: [[0, 0], [5000, 0], [5000, 3000], [0, 3000]],
          walls: [
            { from: 0, to: 1, length: 5000, height: 2800, material: "wallpaper" },
            { from: 1, to: 2, length: 3000, height: 2800, material: "wallpaper" },
            { from: 2, to: 3, length: 5000, height: 2800, material: "wallpaper" },
            { from: 3, to: 0, length: 3000, height: 2800, material: "wallpaper" }
          ],
          floor: { material: "carpet" }
        }],
        metadata: { source: "default", scale: 1 }
      };

      currentData = sampleData;

      if (!renderer) {
        const container = document.getElementById('three-container');
        renderer = new ThreeRoomRenderer(container, {
          width: container.offsetWidth,
          height: container.offsetHeight,
          backgroundColor: 0x09090b
        });
      }

      renderer.loadFloorPlan(sampleData);
      const areas = renderer.getAreas();

      document.getElementById('filename').textContent = 'サンプル';
      document.getElementById('floor-area').textContent = areas.floorArea + ' m²';
      document.getElementById('wall-area').textContent = areas.wallArea + ' m²';
      document.getElementById('room-count').textContent = '1';

      document.getElementById('btn-reset').disabled = false;
      document.getElementById('btn-download').disabled = false;

      showStatus('✅ サンプル間取りを読み込みました', 'success');
    }

    function resetCamera() {
      if (renderer) {
        renderer.camera.position.set(5000, 3000, 5000);
        renderer.camera.lookAt(2500, 0, 1500);
      }
    }

    function downloadJSON() {
      if (!currentData) return;

      const json = JSON.stringify(currentData, null, 2);
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'floor-plan-data.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function showStatus(message, type) {
      const status = document.getElementById('status');
      status.textContent = message;
      status.className = 'status show ' + type;
    }

    // Initialize on load
    document.addEventListener('DOMContentLoaded', init);

    // Handle window resize
    window.addEventListener('resize', () => {
      if (renderer) {
        const container = document.getElementById('three-container');
        renderer.renderer.setSize(container.offsetWidth, container.offsetHeight);
      }
    });
  </script>
</body>
</html>
