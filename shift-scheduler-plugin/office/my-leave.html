<!--
  ============================================================
  有給休暇照会画面(従業員本人用/WordPress DB版・Firestore不使用)
  Cocoon(WordPress)の固定ページ「カスタムHTML」ブロックに
  このファイルの中身をそのまま貼り付けて使用します。
  「マッシュオフィスシステム(WordPress DB版)」プラグインを有効化しておく必要があります。

  従業員が自分自身の有給休暇の残日数・次回失効予定・付与履歴・年5日取得義務の状況を
  確認できる画面です(自分の分だけを見られ、他人の分は見られません)。
  ログイン状態(mush_nippo_auth)は日報・タイムカードのページと共通です。
  ============================================================
-->
<!-- ============================================================
     従業員ログインゲート(日報・タイムカードと共通のログイン状態を使う)
     ============================================================ -->
<div id="mushNippoGate" style="position:fixed;inset:0;z-index:99999;background:#f7f6f3;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;">
  <div style="background:#fff;border:1px solid #e4e2dc;border-radius:10px;padding:32px 28px;max-width:340px;width:90%;box-shadow:0 2px 10px rgba(0,0,0,.06);box-sizing:border-box;">
    <h2 style="margin:0 0 6px;font-size:16px;color:#1E2A4A;">ログイン</h2>
    <p style="margin:0 0 16px;font-size:12px;color:#6B7280;line-height:1.6;">ご自身のお名前とパスワードでログインしてください。</p>
    <select id="mushNippoStaff" style="width:100%;padding:10px 12px;border:1px solid #E4E2DC;border-radius:7px;font-size:14px;margin-bottom:10px;box-sizing:border-box;font-family:inherit;background:#fff;">
      <option value="">-- 読み込み中… --</option>
    </select>
    <input type="password" id="mushNippoPw" placeholder="パスワード" autocomplete="off" style="width:100%;padding:10px 12px;border:1px solid #E4E2DC;border-radius:7px;font-size:14px;margin-bottom:10px;box-sizing:border-box;font-family:inherit;">
    <div id="mushNippoErr" style="color:#E4572E;font-size:12px;margin-bottom:10px;min-height:14px;"></div>
    <button id="mushNippoSubmit" style="width:100%;padding:11px;background:#1E2A4A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">ログイン</button>
  </div>
</div>
<script>
(function(){
  function getSiteBasePath(){
    var els = document.querySelectorAll('link[href*="/wp-content/"], script[src*="/wp-content/"]');
    for (var i=els.length-1;i>=0;i--){
      var url = els[i].href || els[i].src;
      if(!url) continue;
      try{
        var u = new URL(url, window.location.href);
        var idx = u.pathname.indexOf('/wp-content/');
        if(idx !== -1) return u.pathname.substring(0, idx);
      }catch(e){}
    }
    return '';
  }
  function getRestApiBase(){
    var link = document.querySelector('link[rel="https://api.w.org/"]');
    if(link && link.href) return link.href.replace(/\/$/, '');
    return getSiteBasePath() + '/wp-json';
  }
  var API_BASE = getRestApiBase() + '/mush-office/v1';
  var STORAGE_KEY = 'mush_nippo_auth';

  function loadAuth(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var auth = JSON.parse(raw);
      if(!auth || !auth.token || !auth.expiresAt || Date.now() > auth.expiresAt) return null;
      return auth;
    }catch(e){ return null; }
  }
  function saveAuth(auth){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(auth)); }catch(e){}
  }

  var gate = document.getElementById('mushNippoGate');
  if(loadAuth()){
    gate.style.display = 'none';
  } else {
    var pwInput = document.getElementById('mushNippoPw');
    var errEl = document.getElementById('mushNippoErr');
    var btn = document.getElementById('mushNippoSubmit');
    var staffSelect = document.getElementById('mushNippoStaff');
    var DEPTS = ['営業', 'デザイン', '製作', '事務'];

    function loadStaffOptions(){
      fetch(API_BASE + '/employees').then(function(res){
        return res.json();
      }).then(function(rows){
        if(!Array.isArray(rows)) rows = [];
        // 「従業員登録」で追加した新しい部署の従業員も選べるよう、所属している部署を一覧に加える。
        for(var x=0; x<rows.length; x++){ var dn = rows[x].department; if(dn){ if(DEPTS.indexOf(dn) === -1){ DEPTS.push(dn); } } }
        var html = '<option value="">-- 選択してください --</option>';
        for(var d=0; d<DEPTS.length; d++){
          var dept = DEPTS[d];
          var opts = '';
          for(var i=0; i<rows.length; i++){
            var r = rows[i];
            if(r.department === dept){
              opts += '<option value="' + r.id + '">' + String(r.name).replace(/[&<>"]/g, function(c){
                return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
              }) + '</option>';
            }
          }
          if(opts){ html += '<optgroup label="' + dept + '">' + opts + '</optgroup>'; }
        }
        staffSelect.innerHTML = html;
      }).catch(function(e){
        staffSelect.innerHTML = '<option value="">-- 選択してください --</option>';
      });
    }
    loadStaffOptions();

    function tryLogin(){
      var password = pwInput.value;
      if(!password){ errEl.textContent = 'パスワードを入力してください。'; return; }
      var staffId = staffSelect.value;
      if(!staffId){ errEl.textContent = 'ご自身のお名前を選択してください。'; return; }
      btn.disabled = true; btn.textContent = '確認中…';
      fetch(API_BASE + '/auth/login', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ staffId: staffId, password: password }),
      }).then(function(res){
        return res.json().then(function(data){ return { ok: res.ok, data: data }; });
      }).then(function(result){
        if(!result.ok){
          var msg = 'ログインに失敗しました。';
          if(result.data){ if(result.data.error){ msg = result.data.error; } }
          throw new Error(msg);
        }
        saveAuth({ token: result.data.token, expiresAt: Date.now() + (result.data.expiresIn * 1000) });
        gate.style.display = 'none';
        try{ window.dispatchEvent(new Event('mushNippoAuthed')); }catch(e){}
      }).catch(function(e){
        var msg = '';
        if(e){ if(e.message){ msg = e.message; } }
        errEl.textContent = msg || 'ログインに失敗しました。';
      }).then(function(){
        btn.disabled = false; btn.textContent = 'ログイン';
      });
    }

    btn.addEventListener('click', tryLogin);
    pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryLogin(); });
    pwInput.focus();
  }
})();
</script>

<script>
(function(){
  function getSiteBasePath(){
    var els = document.querySelectorAll('link[href*="/wp-content/"], script[src*="/wp-content/"]');
    for (var i=els.length-1;i>=0;i--){
      var url = els[i].href || els[i].src;
      if(!url) continue;
      try{
        var u = new URL(url, window.location.href);
        var idx = u.pathname.indexOf('/wp-content/');
        if(idx !== -1) return u.pathname.substring(0, idx);
      }catch(e){}
    }
    return '';
  }
  function getRestApiBase(){
    var link = document.querySelector('link[rel="https://api.w.org/"]');
    if(link && link.href) return link.href.replace(/\/$/, '');
    return getSiteBasePath() + '/wp-json';
  }
  var API_BASE = getRestApiBase() + '/mush-office/v1';

  function apiFetch(url, opts){
    var o = Object.assign({}, opts || {});
    var a = null;
    try{ a = JSON.parse(localStorage.getItem('mush_nippo_auth') || 'null'); }catch(e){ a = null; }
    if(!(a && a.token && a.expiresAt > Date.now())) a = null;
    o.headers = Object.assign({}, o.headers || {}, a ? { Authorization: 'Bearer ' + a.token } : {});
    return fetch(url, o);
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  var state = {
    data: null, loading: true, errorMsg: '',
    payslips: [], payslipsLoading: false, payslipsErrorMsg: '',
    selectedPayslip: null, selectedKey: '', selectedLoading: false, selectedErrorMsg: '',
    // 年末調整の申告(本人が入力して提出する)。formは入力中の値(入力のたびに再描画はしない)。
    decl: { year: new Date().getFullYear(), loaded: false, loading: false, form: null, submittedAt: '', msg: '', ok: false, saving: false },
  };

  function statusLabel(status){
    if (status === 'ok') { return 'クリア'; }
    if (status === 'warning') { return '未達(期限内)'; }
    return '未達(期限超過)';
  }

  // 年末調整の過不足額(徴収はプラス、還付はマイナス)。0円のときは空欄にする。
  function yearEndCell(p){
    var v = Math.round(Number(p.yearEndAdjustment) || 0);
    if (v === 0) { return psCell('', ''); }
    return psCell('年末調整', (v < 0 ? '-' : '') + yen(Math.abs(v)));
  }
  function yen(n){
    var v = Number(n) || 0;
    return '¥' + v.toLocaleString('ja-JP');
  }
  function minutesToHM(mins){
    if (mins === null || mins === undefined || isNaN(mins)) { return '0:00'; }
    var neg = mins < 0;
    var abs = Math.round(Math.abs(mins));
    var h = Math.floor(abs / 60);
    var m = abs % 60;
    var label = h + ':' + String(m).padStart(2, '0');
    return neg ? ('-' + label) : label;
  }
  // 支給・控除の内訳から、総支給額・課税対象額(当月分)・総控除額・差引支給額を計算する
  // (給与計算ページの計算ロジックと同じ。保存済みの明細書データを表示用に集計するだけ)。
  function derivePayslipTotals(p){
    var paymentItems = [
      { amount: p.basicPay, taxable: true },
      { amount: p.overtimePay, taxable: true },
      { amount: p.holidayPay, taxable: true },
      { amount: p.nightPay, taxable: true },
      { amount: p.commuteAllowance, taxable: p.commuteTaxable },
      { amount: p.qualificationAllowance, taxable: p.qualificationTaxable },
      { amount: p.positionAllowance, taxable: p.positionTaxable },
      { amount: p.housingAllowance, taxable: p.housingTaxable },
      { amount: p.familyAllowance, taxable: p.familyTaxable },
      { amount: p.other1Amount, taxable: p.other1Taxable },
      { amount: p.other2Amount, taxable: p.other2Taxable },
      { amount: p.other3Amount, taxable: p.other3Taxable },
    ];
    var grossPay = 0;
    var taxableThisMonth = 0;
    paymentItems.forEach(function(it){
      var amt = Number(it.amount) || 0;
      grossPay += amt;
      if (it.taxable) { taxableThisMonth += amt; }
    });
    var deductionItems = [
      p.employmentInsurance, p.healthInsurance, p.careInsurance, p.pensionInsurance, p.childSupport,
      p.incomeTax, p.residentTax, p.lifeInsurance, p.wageSavings, p.stockOwnership, p.yearEndAdjustment,
    ];
    var totalDeduction = 0;
    deductionItems.forEach(function(v){ totalDeduction += Number(v) || 0; });
    var netPay = grossPay - totalDeduction;
    return { grossPay: grossPay, taxableThisMonth: taxableThisMonth, totalDeduction: totalDeduction, netPay: netPay };
  }

  window.__myleave = {
    // 年末調整の申告: 入力中の値は状態にだけ保存し、再描画はしない(入力中にカーソルが外れないように)。
    setDecl: function(key, val){ state.decl.form[key] = val; },
    setDeclYear: function(v){
      state.decl.year = Number(v) || new Date().getFullYear();
      state.decl.loaded = false; state.decl.msg = '';
      render();
    },
    loadDecl: async function(){
      var d = state.decl;
      d.loading = true;
      var year = d.year;
      var form = declEmptyForm();
      var submittedAt = '';
      try {
        var res = await apiFetch(API_BASE + '/my-year-end/' + year);
        var rec = res.ok ? await res.json() : false;
        if(rec){
          if(rec.data){ for(var k in rec.data){ if(Object.prototype.hasOwnProperty.call(form, k)){ form[k] = rec.data[k]; } } }
          submittedAt = rec.submittedAt || '';
        }
      } catch(e) { /* 取得できなければ空の入力欄 */ }
      if(d.year !== year){ d.loading = false; return; }
      d.form = form; d.submittedAt = submittedAt; d.loaded = true; d.loading = false;
      render();
    },
    submitDecl: async function(){
      var d = state.decl;
      if(d.saving){ return; }
      d.saving = true; d.msg = ''; render();
      try {
        var res = await apiFetch(API_BASE + '/my-year-end/' + d.year, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: d.form })
        });
        var data = await res.json().catch(function(){ return null; });
        if(!res.ok){ throw new Error((data ? data.error : '') || '提出に失敗しました。'); }
        d.submittedAt = data.submittedAt || '';
        d.msg = '提出しました。会社の担当者が内容を確認します。'; d.ok = true;
      } catch(e) {
        d.msg = e.message || '提出に失敗しました。通信環境をご確認ください。'; d.ok = false;
      }
      d.saving = false; render();
    },
    selectPayslip: async function(year, month){
      state.selectedKey = year + '-' + month;
      state.selectedLoading = true;
      state.selectedErrorMsg = '';
      state.selectedPayslip = null;
      render();
      try {
        await ensureCompanySeal();
        var res = await apiFetch(API_BASE + '/my-payslips/' + year + '/' + month);
        var data = await res.json().catch(function(){ return null; });
        if (!res.ok) { throw new Error((data && data.error) || '取得に失敗しました。'); }
        state.selectedPayslip = data ? data.data : null;
        if (!state.selectedPayslip) { state.selectedErrorMsg = 'この月の給与明細書はまだ作成されていません。'; }
      } catch (e) {
        state.selectedErrorMsg = e.message || '取得に失敗しました。通信環境をご確認ください。';
      }
      state.selectedLoading = false;
      render();
    },
    printPayslip: function(){
      if (!state.selectedPayslip) { return; }
      window.print();
    },
  };

  async function loadMyPayslips(){
    state.payslipsLoading = true; render();
    try {
      var res = await apiFetch(API_BASE + '/my-payslips');
      var data = await res.json();
      if (!res.ok) { throw new Error((data && data.error) || '取得に失敗しました。'); }
      state.payslips = data || [];
    } catch (e) {
      state.payslips = [];
      state.payslipsErrorMsg = e.message || '取得に失敗しました。通信環境をご確認ください。';
    }
    state.payslipsLoading = false; render();
  }

  async function init(){
    state.loading = true; render();
    try {
      var res = await apiFetch(API_BASE + '/my-leave-balance');
      var data = await res.json();
      if (!res.ok) { throw new Error((data && data.error) || '取得に失敗しました。'); }
      state.data = data;
    } catch (e) {
      state.errorMsg = e.message || '取得に失敗しました。通信環境をご確認ください。';
    }
    state.loading = false;
    render();
    loadMyPayslips();
  }
  window.addEventListener('mushNippoAuthed', function(){ init(); });
  init();
})();
</script>

<script>
  // ============================================================
  // ログアウトボタン(管理者・従業員どちらでも)。ログイン中だけ、画面の右上に出す。
  // 押すと、このブラウザに保存してあるログイン情報(管理者・従業員)を消して、ページを開き直す。
  // ※この範囲では論理積(アンパサンド2つ)や山かっこの比較を使わない(WordPressの表示処理が記号を壊すことがあるため)。
  // ============================================================
  (function () {
    if (window.__mushLogoutInstalled) { return; }
    window.__mushLogoutInstalled = true;
    var KEYS = ['mush_admin_auth', 'mush_nippo_auth'];
    function isValid(key) {
      try {
        var a = JSON.parse(localStorage.getItem(key) || 'null');
        if (!a) { return false; }
        if (!a.token) { return false; }
        return a.expiresAt > Date.now();
      } catch (e) { return false; }
    }
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'mush-logout-btn';
    btn.style.cssText = 'position:fixed;top:44px;right:12px;z-index:99998;display:none;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:4px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:inherit;';
    btn.addEventListener('click', function () {
      if (!confirm('ログアウトしますか?')) { return; }
      KEYS.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
      location.reload();
    });
    function update() {
      var admin = isValid(KEYS[0]);
      var emp = isValid(KEYS[1]);
      if (admin || emp) {
        btn.textContent = admin ? '管理者ログアウト' : 'ログアウト';
        btn.style.display = 'block';
      } else {
        btn.style.display = 'none';
      }
    }
    function attach() {
      if (!document.body) { return; }
      document.body.appendChild(btn);
      update();
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', attach); } else { attach(); }
    ['mushAdminAuthed', 'mushLoginAuthed', 'mushNippoAuthed', 'mushKeiriAuthed'].forEach(function (ev) {
      window.addEventListener(ev, function () { setTimeout(update, 300); });
    });
    window.addEventListener('storage', update);
    setInterval(update, 3000); // ログイン・ログアウトの状態を見るだけ(画面の読み込みはしない)
  })();
</script>
