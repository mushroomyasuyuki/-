<script>
(function(){
  function getSiteBasePath(){
    var els = document.querySelectorAll('link[href*="/wp-content/"], script[src*="/wp-content/"]');
    for (var i=els.length-1;i>=0;i--){
      var url = els[i].href || els[i].src;
      if(!url) continue;
      try{
        var u = new URL(url, window.location.href);
        var idx = u.pathname.indexOf('/wp-content/');
        if(idx !== -1) return u.pathname.substring(0, idx);
      }catch(e){}
    }
    return '';
  }
  function getRestApiBase(){
    var link = document.querySelector('link[rel="https://api.w.org/"]');
    if(link && link.href) return link.href.replace(/\/$/, '');
    return getSiteBasePath() + '/wp-json';
  }
  var API_BASE = getRestApiBase() + '/mush-office/v1';
  var STORAGE_KEY = 'mush_admin_auth';

  function loadAuth(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var auth = JSON.parse(raw);
      if(!auth || !auth.token || !auth.expiresAt || Date.now() > auth.expiresAt) return null;
      return auth;
    }catch(e){ return null; }
  }
  function saveAuth(auth){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(auth)); }catch(e){}
  }

  var gate = document.getElementById('mushAdminGate');
  if(loadAuth()){
    gate.style.display = 'none';
    return;
  }

  var pwInput = document.getElementById('mushAdminPw');
  var errEl = document.getElementById('mushAdminErr');
  var btn = document.getElementById('mushAdminSubmit');
  var staffSelect = document.getElementById('mushAdminStaff');
  var DEPTS = ['営業', 'デザイン', '製作', '事務'];

  function loadStaffOptions(){
    fetch(API_BASE + '/employees').then(function(res){
      return res.json();
    }).then(function(rows){
      if(!Array.isArray(rows)) rows = [];
      // 「従業員登録」で追加した新しい部署の従業員も選べるよう、所属している部署を一覧に加える。
      for(var x=0; x<rows.length; x++){ var dn = rows[x].department; if(dn){ if(DEPTS.indexOf(dn) === -1){ DEPTS.push(dn); } } }
      var html = '<option value="">-- 共通の管理者パスワードでログイン --</option>';
      for(var d=0; d<DEPTS.length; d++){
        var dept = DEPTS[d];
        var opts = '';
        for(var i=0; i<rows.length; i++){
          var r = rows[i];
          if(r.department === dept){
            opts += '<option value="' + r.id + '">' + String(r.name).replace(/[&<>"]/g, function(c){
              return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
            }) + '</option>';
          }
        }
        if(opts){ html += '<optgroup label="' + dept + '">' + opts + '</optgroup>'; }
      }
      staffSelect.innerHTML = html;
    }).catch(function(e){
      staffSelect.innerHTML = '<option value="">-- 共通の管理者パスワードでログイン --</option>';
    });
  }
  loadStaffOptions();

  function tryLogin(){
    var password = pwInput.value;
    if(!password){ errEl.textContent = 'パスワードを入力してください。'; return; }
    var staffId = staffSelect.value;
    var isStaffLogin = !!staffId;
    var url = isStaffLogin ? (API_BASE + '/auth/login') : (API_BASE + '/admin/login');
    var body = isStaffLogin ? { staffId: staffId, password: password } : { password: password };
    btn.disabled = true; btn.textContent = '確認中…';
    fetch(url, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(!result.ok){
        var msg = 'ログインに失敗しました。';
        if(result.data){ if(result.data.error){ msg = result.data.error; } }
        throw new Error(msg);
      }
      if(isStaffLogin){
        if(!result.data.isAdmin){ throw new Error('このアカウントには管理者権限がありません。'); }
      }
      saveAuth({ token: result.data.token, expiresAt: Date.now() + (result.data.expiresIn * 1000) });
      gate.style.display = 'none';
      try{ window.dispatchEvent(new Event('mushAdminAuthed')); }catch(e){}
    }).catch(function(e){
      var msg = '';
      if(e){ if(e.message){ msg = e.message; } }
      errEl.textContent = msg || 'ログインに失敗しました。';
    }).then(function(){
      btn.disabled = false; btn.textContent = 'ログイン';
    });
  }

  btn.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryLogin(); });
  pwInput.focus();
})();
</script>

<script>
  function getSiteBasePath(){
    const els = document.querySelectorAll('link[href*="/wp-content/"], script[src*="/wp-content/"]');
    for (const el of els){
      const url = el.href || el.src;
      if(!url) continue;
      try{
        const u = new URL(url, window.location.href);
        const idx = u.pathname.indexOf('/wp-content/');
        if(idx !== -1){ return u.pathname.substring(0, idx); }
      }catch(e){}
    }
    return '';
  }
  function getRestApiBase(){
    const link = document.querySelector('link[rel="https://api.w.org/"]');
    if(link && link.href){ return link.href.replace(/\/$/, ''); }
    return getSiteBasePath() + '/wp-json';
  }
  const API_BASE = getRestApiBase() + '/mush-office/v1';

  function apiFetch(url, opts) {
    const o = Object.assign({}, opts || {});
    let a = null;
    try {
      a = JSON.parse(localStorage.getItem("mush_admin_auth") || "null");
      if (!(a && a.token && a.expiresAt > Date.now())) a = JSON.parse(localStorage.getItem("mush_nippo_auth") || "null");
      if (!(a && a.token && a.expiresAt > Date.now())) a = null;
    } catch (e) { a = null; }
    o.headers = Object.assign({}, o.headers || {}, a ? { Authorization: "Bearer " + a.token } : {});
    return fetch(url, o);
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // 厚生労働省「令和8(2026)年度 雇用保険料率のご案内」より(労働者負担分・失業等給付+育児休業給付の保険料率)。
  const EMPLOYMENT_INSURANCE_RATES = {
    general: { label: "一般の事業", employeeRate: 5 / 1000 },
    agriculture: { label: "農林水産・清酒製造の事業", employeeRate: 6 / 1000 },
    construction: { label: "建設の事業", employeeRate: 6 / 1000 },
  };
  function toHalfWidthDigits(s) {
    return String(s == null ? "" : s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  }
  async function lookupAddressByZip(zip, applyAddress) {
    const digits = toHalfWidthDigits(zip).replace(/[^0-9]/g, "");
    if (digits.length !== 7) return;
    try {
      const res = await fetch(`https://zipcloud.ibsnet.co.jp/api/search?zipcode=${digits}`);
      const data = await res.json();
      const r = data && data.results && data.results[0];
      if (r) applyAddress(`${r.address1 || ""}${r.address2 || ""}${r.address3 || ""}`);
    } catch (e) { /* 通信エラー時は何もしない */ }
  }

  // 社印画像の白抜き加工。白い紙に押した印影の写真・スキャン画像を想定し、
  // 白に近い画素ほど透明にすることで、背景を消して印影だけを残す。
  // alpha = 255 - min(R,G,B) という単純な式で、白(255,255,255)は完全透明、
  // 濃い色(朱肉の赤など)はほぼ不透明になる(既存のアルファ値より不透明にはしない)。
  function whitenSealImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imageData.data;
        for (let i = 0; i < d.length; i += 4) {
          const minC = Math.min(d[i], d[i + 1], d[i + 2]);
          d[i + 3] = Math.min(d[i + 3], 255 - minC);
        }
        ctx.putImageData(imageData, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob((blob) => {
          if (blob) { resolve(blob); } else { reject(new Error("画像の変換に失敗しました。")); }
        }, "image/png");
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("画像の読み込みに失敗しました。")); };
      img.src = url;
    });
  }

  const state = {
    companyInfo: {
      name: "", repName: "", postalCode: "", address: "", phone: "", fax: "", website: "", invoiceRegNumber: "",
      bankName: "", bankBranch: "", bankAccountType: "", bankAccountNumber: "", bankAccountHolder: "",
      bankName2: "", bankBranch2: "", bankAccountType2: "", bankAccountNumber2: "", bankAccountHolder2: "",
      sealImageUrl: "",
      sealSize: 44,
      sealWhitened: false,
      workStartTime: "09:00", workEndTime: "18:00", breakMinutes: 60, timeRoundingMinutes: 1, overtimeRate: 25, nightRate: 25, holidayRate: 35,
      payrollCutoffDay: "末日", payrollPaymentOffsetMonths: 0, payrollPaymentDay: "末日",
      employmentInsuranceIndustry: "general",
      weeklyHolidays: [0], // 0=日,1=月,...,6=土。毎週の定休日(初期値は日曜のみ)
      holidayDates: [], // ["YYYY-MM-DD", ...] 定休日以外の個別の休日(祝日・会社指定日など)
    },
    companyForm: null,
    companySaved: false,
    companyError: "",
    holidayCalendarMonth: (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; })(),

    adminPasswordForm: { newPassword: "" },
    adminPasswordMsg: "",
    adminPasswordSaved: false,
    adminPasswordIsSet: null,

    documents: [],
    documentsLoading: true,
    docTitle: "",
    docFile: null,
    docUploading: false,
    docMsg: "",

    sealFile: null,
    sealUploading: false,
    sealMsg: "",
    sealWhiten: true, // アップロード時に背景の白抜き加工を行うかどうかのチェックボックス状態
  };

  async function loadCompanyInfo() {
    try {
      const res = await apiFetch(`${API_BASE}/company-info`);
      state.companyInfo = res.ok ? await res.json() : state.companyInfo;
    } catch (e) { /* 取得できなくても他の機能は使えるようにする */ }
    render();
  }
  async function loadAdminPasswordStatus() {
    try {
      const res = await fetch(`${API_BASE}/admin/password-status`);
      const data = res.ok ? await res.json() : { isSet: false };
      state.adminPasswordIsSet = !!data.isSet;
    } catch (e) { state.adminPasswordIsSet = null; }
    render();
  }
  async function loadDocuments() {
    state.documentsLoading = true; render();
    try {
      const res = await apiFetch(`${API_BASE}/company-documents`);
      state.documents = res.ok ? await res.json() : [];
    } catch (e) { state.documents = []; }
    state.documentsLoading = false; render();
  }

  window.__jisha = {
    setCompanyField(key, val) {
      if (!state.companyForm) state.companyForm = { ...state.companyInfo };
      state.companyForm[key] = key === "postalCode" ? toHalfWidthDigits(val).replace(/[^0-9]/g, "").slice(0, 7) : val;
      state.companySaved = false;
      if (key === "postalCode") {
        lookupAddressByZip(val, (addr) => { state.companyForm.address = addr; render(); });
      }
      render();
    },
    toggleWeeklyHoliday(dow) {
      if (!state.companyForm) { state.companyForm = { ...state.companyInfo }; }
      const current = state.companyForm.weeklyHolidays || [];
      const arr = current.includes(dow) ? current.filter(d => d !== dow) : [...current, dow];
      state.companyForm.weeklyHolidays = arr;
      state.companySaved = false;
      render();
    },
    toggleHolidayDate(dateStr) {
      if (!state.companyForm) { state.companyForm = { ...state.companyInfo }; }
      const current = state.companyForm.holidayDates || [];
      const arr = current.includes(dateStr) ? current.filter(d => d !== dateStr) : [...current, dateStr];
      state.companyForm.holidayDates = arr;
      state.companySaved = false;
      render();
    },
    shiftHolidayCalendarMonth(delta) {
      const [y, m] = state.holidayCalendarMonth.split("-").map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      state.holidayCalendarMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
      render();
    },
    async saveCompanyInfo() {
      const data = state.companyForm || state.companyInfo;
      state.companyError = "";
      try {
        const res = await apiFetch(`${API_BASE}/company-info`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        if (!res.ok) throw new Error();
        state.companyInfo = await res.json();
        state.companyForm = null;
        state.companySaved = true;
      } catch (e) {
        state.companyError = "保存に失敗しました。通信環境をご確認ください。";
      }
      render();
    },
    setAdminPasswordField(key, val) {
      state.adminPasswordForm[key] = val;
      state.adminPasswordSaved = false;
      render();
    },
    async saveAdminPassword() {
      const { newPassword } = state.adminPasswordForm;
      state.adminPasswordMsg = "";
      if (!newPassword) {
        state.adminPasswordMsg = "新しいパスワードを入力してください。";
        render();
        return;
      }
      try {
        const res = await apiFetch(`${API_BASE}/admin/set-password`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: newPassword }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error((data && data.error) || "保存に失敗しました。");
        state.adminPasswordForm = { newPassword: "" };
        state.adminPasswordIsSet = true;
        state.adminPasswordSaved = true;
      } catch (e) {
        state.adminPasswordMsg = e.message || "保存に失敗しました。通信環境をご確認ください。";
      }
      render();

    setDocTitle(val) { state.docTitle = val; render(); },
    onDocFileSelected(input) {
      state.docFile = input.files ? input.files[0] : null;
      state.docMsg = "";
      render();

    async uploadDocument() {
      if (!state.docFile) { state.docMsg = "ファイルを選択してください。"; render(); return; }
      state.docUploading = true; state.docMsg = ""; render();
      try {
        const fd = new FormData();
        fd.append("title", state.docTitle || "");
        fd.append("file", state.docFile);
        const res = await apiFetch(`${API_BASE}/company-documents`, { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error((data && data.error) || "登録に失敗しました。");
        state.docTitle = "";
        state.docFile = null;
        state.docMsg = "登録しました。";
        await loadDocuments();
      } catch (e) {
        state.docMsg = e.message || "登録に失敗しました。通信環境をご確認ください。";
      }
      state.docUploading = false; render();
    },
    async deleteDocument(id, label) {
      if (!confirm(`「${label}」を削除しますか？`)) return;
      try {
        const res = await apiFetch(`${API_BASE}/company-documents/${id}`, { method: "DELETE" });
        if (!res.ok) throw new Error("削除に失敗しました。");
        await loadDocuments();
      } catch (e) {
        alert(e.message || "削除に失敗しました。");
      }
    },
    onSealFileSelected(input) {
      state.sealFile = input.files ? input.files[0] : null;
      state.sealMsg = "";
      render();
    },
    toggleSealWhiten() {
      state.sealWhiten = !state.sealWhiten;
      render();
    },
    async uploadSeal() {
      if (!state.sealFile) { state.sealMsg = "画像ファイルを選択してください。"; render(); return; }
      state.sealUploading = true; state.sealMsg = ""; render();
      try {
        let uploadFile = state.sealFile;
        if (state.sealWhiten) {
          const blob = await whitenSealImage(state.sealFile);
          uploadFile = new File([blob], "seal.png", { type: "image/png" });
        }
        const fd = new FormData();
        fd.append("file", uploadFile);
        fd.append("whitened", state.sealWhiten ? "1" : "0");
        const res = await apiFetch(`${API_BASE}/company-seal`, { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error((data && data.error) || "登録に失敗しました。");
        state.companyInfo.sealImageUrl = data.sealImageUrl;
        state.companyInfo.sealWhitened = data.sealWhitened;
        if (state.companyForm) {
          state.companyForm.sealImageUrl = data.sealImageUrl;
          state.companyForm.sealWhitened = data.sealWhitened;
        }
        state.sealFile = null;
        state.sealMsg = "登録しました。";
      } catch (e) {
        state.sealMsg = e.message || "登録に失敗しました。通信環境をご確認ください。";
      }
      state.sealUploading = false; render();

    async deleteSeal() {
      if (!confirm("社印画像を削除しますか？")) return;
      try {

        if (!res.ok) throw new Error("削除に失敗しました。");

        if (state.companyForm) { state.companyForm.sealImageUrl = ""; state.companyForm.sealWhitened = false; }
        render();
      } catch (e) {
        alert(e.message || "削除に失敗しました。");
      }
    },
  };

  function renderHolidayCalendar(f) {
    const parts = state.holidayCalendarMonth.split("-");
    const y = Number(parts[0]);
    const m = Number(parts[1]);
    const daysInMonth = new Date(y, m, 0).getDate();
    const startDow = new Date(y, m - 1, 1).getDay();
    const weekdayLabels = ["日", "月", "火", "水", "木", "金", "土"];
    const weeklyHolidays = f.weeklyHolidays || [];
    const holidayDates = f.holidayDates || [];

    let cells = "";
    for (let i = 0; i < startDow; i++) {
      cells += `<div class="holiday-cal-cell empty"></div>`;
    }
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${y}-${String(m).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const dow = new Date(y, m - 1, day).getDay();
      const isWeeklyHoliday = weeklyHolidays.includes(dow);
      const isExtraHoliday = holidayDates.includes(dateStr);
      let cls = "holiday-cal-cell";
      if (isWeeklyHoliday) { cls += " weekly-holiday"; }
      else if (isExtraHoliday) { cls += " extra-holiday"; }
      const clickAttr = isWeeklyHoliday ? "" : `onclick="__jisha.toggleHolidayDate('${dateStr}')"`;
      cells += `<div class="${cls}" ${clickAttr}>${day}</div>`;
    }

    return `
      <div class="holiday-cal">
        <div class="holiday-cal-nav">
          <button type="button" onclick="__jisha.shiftHolidayCalendarMonth(-1)">‹</button>
          <span>${y}年${m}月</span>
          <button type="button" onclick="__jisha.shiftHolidayCalendarMonth(1)">›</button>
        </div>
        <div class="holiday-cal-grid holiday-cal-head">
          ${weekdayLabels.map(w => `<div>${w}</div>`).join("")}
        </div>
        <div class="holiday-cal-grid">${cells}</div>
        <p class="holiday-cal-legend">オレンジ=休日。毎週の定休日以外の日をクリックすると、個別の休日として追加・解除できます(祝日や会社指定の休みなど)。</p>
      </div>`;
  }

          <input type="range" min="20" max="120" step="2" value="${f.sealSize}" oninput="__jisha.setCompanyField('sealSize', Number(this.value))">
          <div class="form-actions">
            <button class="btn-primary" onclick="__jisha.saveCompanyInfo()">サイズを保存する</button>
            ${state.companySaved ? `<span class="msg ok">保存しました</span>` : ""}
          </div>
        ` : `<p class="empty-note">まだ登録されていません。</p>`}
        <label>画像ファイル</label>
        <input type="file" accept="image/png,image/jpeg,image/gif" onchange="__jisha.onSealFileSelected(this)">
        ${state.sealFile ? `<p class="file-selected-note">選択中: ${escapeHtml(state.sealFile.name)}</p>` : ""}
        <label class="checkbox-line"><input type="checkbox" ${state.sealWhiten ? "checked" : ""} onchange="__jisha.toggleSealWhiten()"> 白抜き処理する(白い紙に押した印影の写真から、背景の白を透明にして印影だけを残します)</label>
        <div class="form-actions">
          <button class="btn-primary" ${state.sealUploading ? "disabled" : ""} onclick="__jisha.uploadSeal()">${state.sealUploading ? "登録中…" : (f.sealImageUrl ? "差し替える" : "登録する")}</button>
        </div>
        ${state.sealMsg ? `<p class="msg ${state.sealMsg === "登録しました。" ? "ok" : "err"}">${escapeHtml(state.sealMsg)}</p>` : ""}
      </div>`;
  }

  // 再描画のたびに#jisha-app全体のinnerHTMLを作り直しているため、何もしないとinput/selectへの
  // フォーカスとカーソル位置が毎回失われ、1文字入力するごとにフォーカスが外れて次の文字が
  // 入力できなくなる。oninput/onchange属性の文字列(各項目でキー名が異なるため実質的に一意)を
  // 手がかりに、再描画後に同じ項目へフォーカスとカーソル位置を復元する。
  function captureFocus() {
    const app = document.getElementById("jisha-app");
    const active = document.activeElement;
    if (!active) { return null; }
    if (!app.contains(active)) { return null; }
    const key = active.getAttribute("oninput") || active.getAttribute("onchange");
    if (!key) { return null; }
    return {
      key,
      selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
      selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null,
    };
  }
  function restoreFocus(focusInfo) {
    if (!focusInfo) { return; }
    const app = document.getElementById("jisha-app");
    const candidates = app.querySelectorAll("input, select, textarea");
    for (const el of candidates) {
      const key = el.getAttribute("oninput") || el.getAttribute("onchange");
      if (key !== focusInfo.key) { continue; }
      el.focus();
      if (focusInfo.selectionStart === null) { break; }
      if (typeof el.setSelectionRange !== "function") { break; }
      try {
        el.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd);
      } catch (e) { /* type=number等、カーソル位置指定に対応していない場合は無視 */ }
      break;
    }
  }

  // 日本語入力(IME変換)の途中でrender()がDOMを丸ごと作り直すと、変換中の要素が
  // 差し替えられてIMEの変換状態が壊れ、日本語が入力できなくなってしまう。
  // 変換中(compositionstart〜compositionend)はrender()を止め、変換確定後に1回だけ描画し直す。
  let imeComposing = false;
  document.getElementById("jisha-app").addEventListener("compositionstart", () => { imeComposing = true; });
  document.getElementById("jisha-app").addEventListener("compositionend", () => { imeComposing = false; render(); });

  function render() {
    if (imeComposing) { return; }
    const focusInfo = captureFocus();
    document.getElementById("jisha-app").innerHTML = `
      <div style="text-align:center;padding:10px 16px 0;"><a href="${getSiteBasePath()}/トップ/" style="color:#8a8577;font-size:13px;text-decoration:underline;">← トップに戻る</a></div>
      <div class="header">
        <h1>自社情報</h1>
        <p>会社情報・振込先情報・書類の保管を行います</p>
      </div>
      ${renderCompanyPanel()}
      ${renderSealPanel()}
      ${'' /* マッシュオフィス 経理・管理・勤怠：管理者共通パスワードは使わない（ログインは一人ずつ） */}
      ${renderDocumentsPanel()}
      <div class="back-link">
        <a href="${getSiteBasePath()}/トップ/">← トップに戻る</a>
      </div>
    `;
    restoreFocus(focusInfo);
  }

  async function init() {
    await Promise.all([loadCompanyInfo(), loadDocuments()]);
    render();
  }
  window.addEventListener("mushAdminAuthed", () => { init(); });
  init();
</script>

<script>
  // ============================================================
  // ログアウトボタン(管理者・従業員どちらでも)。ログイン中だけ、画面の右上に出す。
  // 押すと、このブラウザに保存してあるログイン情報(管理者・従業員)を消して、ページを開き直す。
  // ※この範囲では論理積(アンパサンド2つ)や山かっこの比較を使わない(WordPressの表示処理が記号を壊すことがあるため)。
  // ============================================================
  (function () {
    if (window.__mushLogoutInstalled) { return; }
    window.__mushLogoutInstalled = true;
    var KEYS = ['mush_admin_auth', 'mush_nippo_auth'];
    function isValid(key) {
      try {
        var a = JSON.parse(localStorage.getItem(key) || 'null');
        if (!a) { return false; }
        if (!a.token) { return false; }
        return a.expiresAt > Date.now();
      } catch (e) { return false; }
    }
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'mush-logout-btn';
    btn.style.cssText = 'position:fixed;top:44px;right:12px;z-index:99998;display:none;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:4px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:inherit;';
    btn.addEventListener('click', function () {
      if (!confirm('ログアウトしますか?')) { return; }
      KEYS.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
      location.reload();
    });
    function update() {
      var admin = isValid(KEYS[0]);
      var emp = isValid(KEYS[1]);
      if (admin || emp) {
        btn.textContent = admin ? '管理者ログアウト' : 'ログアウト';
        btn.style.display = 'block';
      } else {
        btn.style.display = 'none';
      }
    }
    function attach() {
      if (!document.body) { return; }
      document.body.appendChild(btn);
      update();
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', attach); } else { attach(); }
    ['mushAdminAuthed', 'mushLoginAuthed', 'mushNippoAuthed', 'mushKeiriAuthed'].forEach(function (ev) {
      window.addEventListener(ev, function () { setTimeout(update, 300); });
    });
    window.addEventListener('storage', update);
    setInterval(update, 3000); // ログイン・ログアウトの状態を見るだけ(画面の読み込みはしない)
  })();
</script>
