<!--
  ============================================================
  給与計算画面(管理者用/WordPress DB版・Firestore不使用)
  Cocoon(WordPress)の固定ページ「カスタムHTML」ブロックに
  このファイルの中身をそのまま貼り付けて使用します。
  「マッシュオフィスシステム(WordPress DB版)」プラグインを有効化しておく必要があります。

  年度ごとの社会保険・厚生年金保険料額表(Excel)をアップロードし、
  従業員の給与(報酬月額)から控除額を自動計算します。
  Excelの読み取りはSheetJS(ブラウザ内)で行い、サーバーには
  読み取り結果(JSON)と元のExcelファイルの両方を保存します。
  ============================================================
-->
<!-- ============================================================
     管理者ログインゲート(共通)
     従業員登録・管理者チャット・管理者集計・給与計算の各ページで共通のログイン状態
     (localStorageのmush_admin_auth)を共有するので、1回ログインすれば他のページも入れる。
     ============================================================ -->
<div id="mushAdminGate" style="position:fixed;inset:0;z-index:99999;background:#f7f6f3;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;">
  <div style="background:#fff;border:1px solid #e4e2dc;border-radius:10px;padding:32px 28px;max-width:340px;width:90%;box-shadow:0 2px 10px rgba(0,0,0,.06);box-sizing:border-box;">
    <h2 style="margin:0 0 6px;font-size:16px;color:#1E2A4A;">管理者ログイン</h2>
    <p style="margin:0 0 16px;font-size:12px;color:#6B7280;line-height:1.6;">このページは管理者のみ閲覧できます。<br>ご自身のお名前とパスワードでログインしてください。</p>
    <select id="mushAdminStaff" style="width:100%;padding:10px 12px;border:1px solid #E4E2DC;border-radius:7px;font-size:14px;margin-bottom:10px;box-sizing:border-box;font-family:inherit;background:#fff;">
      <option value="">-- 読み込み中… --</option>
    </select>
    <input type="password" id="mushAdminPw" placeholder="パスワード" autocomplete="off" style="width:100%;padding:10px 12px;border:1px solid #E4E2DC;border-radius:7px;font-size:14px;margin-bottom:10px;box-sizing:border-box;font-family:inherit;">
    <div id="mushAdminErr" style="color:#E4572E;font-size:12px;margin-bottom:10px;min-height:14px;"></div>
    <button id="mushAdminSubmit" style="width:100%;padding:11px;background:#1E2A4A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;">ログイン</button>
  </div>
</div>
<script>
(function(){
  function getSiteBasePath(){
    var els = document.querySelectorAll('link[href*="/wp-content/"], script[src*="/wp-content/"]');
    for (var i=els.length-1;i>=0;i--){
      var url = els[i].href || els[i].src;
      if(!url) continue;
      try{
        var u = new URL(url, window.location.href);
        var idx = u.pathname.indexOf('/wp-content/');
        if(idx !== -1) return u.pathname.substring(0, idx);
      }catch(e){}
    }
    return '';
  }
  function getRestApiBase(){
    var link = document.querySelector('link[rel="https://api.w.org/"]');
    if(link && link.href) return link.href.replace(/\/$/, '');
    return getSiteBasePath() + '/wp-json';
  }
  var API_BASE = getRestApiBase() + '/mush-office/v1';
  var STORAGE_KEY = 'mush_admin_auth';

  function loadAuth(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var auth = JSON.parse(raw);
      if(!auth || !auth.token || !auth.expiresAt || Date.now() > auth.expiresAt) return null;
      return auth;
    }catch(e){ return null; }
  }
  function saveAuth(auth){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(auth)); }catch(e){}
  }

  var gate = document.getElementById('mushAdminGate');
  if(loadAuth()){
    gate.style.display = 'none';
    return;
  }

  var pwInput = document.getElementById('mushAdminPw');
  var errEl = document.getElementById('mushAdminErr');
  var btn = document.getElementById('mushAdminSubmit');
  var staffSelect = document.getElementById('mushAdminStaff');
  var DEPTS = ['営業', 'デザイン', '製作', '事務'];

  function loadStaffOptions(){
    fetch(API_BASE + '/employees').then(function(res){
      return res.json();
    }).then(function(rows){
      if(!Array.isArray(rows)) rows = [];
      // 「従業員登録」で追加した新しい部署の従業員も選べるよう、所属している部署を一覧に加える。
      for(var x=0; x<rows.length; x++){ var dn = rows[x].department; if(dn){ if(DEPTS.indexOf(dn) === -1){ DEPTS.push(dn); } } }
      var html = '<option value="">-- 共通の管理者パスワードでログイン --</option>';
      for(var d=0; d<DEPTS.length; d++){
        var dept = DEPTS[d];
        var opts = '';
        for(var i=0; i<rows.length; i++){
          var r = rows[i];
          if(r.department === dept){
            opts += '<option value="' + r.id + '">' + String(r.name).replace(/[&<>"]/g, function(c){
              return c === '&' ? '&amp;' : c === '<' ? '&lt;' : c === '>' ? '&gt;' : '&quot;';
            }) + '</option>';
          }
        }
        if(opts){ html += '<optgroup label="' + dept + '">' + opts + '</optgroup>'; }
      }
      staffSelect.innerHTML = html;
    }).catch(function(e){
      staffSelect.innerHTML = '<option value="">-- 共通の管理者パスワードでログイン --</option>';
    });
  }
  loadStaffOptions();

  function tryLogin(){
    var password = pwInput.value;
    if(!password){ errEl.textContent = 'パスワードを入力してください。'; return; }
    var staffId = staffSelect.value;
    var isStaffLogin = !!staffId;
    var url = isStaffLogin ? (API_BASE + '/auth/login') : (API_BASE + '/admin/login');
    var body = isStaffLogin ? { staffId: staffId, password: password } : { password: password };
    btn.disabled = true; btn.textContent = '確認中…';
    fetch(url, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body),
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if(!result.ok){
        var msg = 'ログインに失敗しました。';
        if(result.data){ if(result.data.error){ msg = result.data.error; } }
        throw new Error(msg);
      }
      if(isStaffLogin){
        if(!result.data.isAdmin){ throw new Error('このアカウントには管理者権限がありません。'); }
      }
      saveAuth({ token: result.data.token, expiresAt: Date.now() + (result.data.expiresIn * 1000) });
      gate.style.display = 'none';
      try{ window.dispatchEvent(new Event('mushAdminAuthed')); }catch(e){}
    }).catch(function(e){
      var msg = '';
      if(e){ if(e.message){ msg = e.message; } }
      errEl.textContent = msg || 'ログインに失敗しました。';
    }).then(function(){
      btn.disabled = false; btn.textContent = 'ログイン';
    });
  }

  btn.addEventListener('click', tryLogin);
  pwInput.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryLogin(); });
  pwInput.focus();
})();
</script>

      if(!url) continue;
      try{
        const u = new URL(url, window.location.href);
        const idx = u.pathname.indexOf('/wp-content/');
        if(idx !== -1){ return u.pathname.substring(0, idx); }
      }catch(e){}
    }
    return '';
  }

      if (!(a && a.token && a.expiresAt > Date.now())) a = JSON.parse(localStorage.getItem("mush_nippo_auth") || "null");
      if (!(a && a.token && a.expiresAt > Date.now())) a = null;
    } catch (e) { a = null; }
    o.headers = Object.assign({}, o.headers || {}, a ? { Authorization: "Bearer " + a.token } : {});
    return fetch(url, o);
  }

  // ============================================================
  // 給与明細書: 時間の計算補助
  // ============================================================
  const WEEKDAY_LABELS = ["日", "月", "火", "水", "木", "金", "土"];
  function timeToMinutes(t) {
    if (!t) return null;
    const m = String(t).match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return null;
    return parseInt(m[1], 10) * 60 + parseInt(m[2], 10);
  }
  function minutesToHM(mins) {
    if (mins === null || mins === undefined || isNaN(mins)) return "0:00";
    const neg = mins < 0;
    const abs = Math.round(Math.abs(mins));
    const h = Math.floor(abs / 60);
    const m = abs % 60;
    const label = `${h}:${String(m).padStart(2, "0")}`;
    return neg ? `-${label}` : label;
  }
  // 自社情報の休憩時間(分)。6時間を超えて働いた日は、実働からこの分を差し引く(労働基準法34条で休憩が必要になる長さ)。
  function breakMinutesOf(companyInfo) {
    const b = (companyInfo || {}).breakMinutes;
    if (b === undefined || b === null || b === "") { return 0; }
    return Math.max(0, Number(b) || 0);
  }
  function workedMinutesAfterBreak(spanMinutes, breakMinutes) {
    return spanMinutes > 360 ? Math.max(0, spanMinutes - breakMinutes) : spanMinutes;
  }

  // 自社情報の勤怠の時間の単位(1〜30分)。1 = 丸めない。
  function roundingUnitOf(companyInfo) {
    const u = Math.round(Number((companyInfo || {}).timeRoundingMinutes) || 1);
    return Math.min(30, Math.max(1, u));
  }
  // その日の出勤・退勤を分にして返す(退勤が出勤以前なら翌日扱い)。単位に合わせて、出勤は切り上げ・退勤は切り捨てる。
  // 打刻がそろっていなければnull。丸めた結果、退勤が出勤より前になったら0分勤務として扱う。
  function dayClockRange(d, companyInfo) {
    const inRaw = timeToMinutes(d.clockIn);
    const outRaw = timeToMinutes(d.clockOut);
    if (inRaw === null) { return null; }
    if (outRaw === null) { return null; }
    let endRaw = outRaw;
    if (endRaw <= inRaw) { endRaw += 1440; }
    const unit = roundingUnitOf(companyInfo);
    const start = Math.ceil(inRaw / unit) * unit;
    const end = Math.max(start, Math.floor(endRaw / unit) * unit);
    return { start, end };
  }

  // 自社情報の始業・終業時刻(未設定なら9:00〜18:00)。
  function stdWorkRange(companyInfo) {
    const info = companyInfo || {};
    const s = timeToMinutes(info.workStartTime);
    const e = timeToMinutes(info.workEndTime);
    return { start: s === null ? 9 * 60 : s, end: e === null ? 18 * 60 : e };
  }
  // 出退勤の時刻から、早出(始業前)・残業(終業後)の分数を自動で出す。区分が「通常」の日だけが対象。
  function autoEarlyOvertime(d, companyInfo) {
    const none = { early: 0, overtime: 0 };
    if (d.dayType !== "通常") { return none; }
    const range = dayClockRange(d, companyInfo);
    if (!range) { return none; }
    const std = stdWorkRange(companyInfo);
    const inMin = range.start;
    const end = range.end;
    // 実際に働いた時間のうち、始業前・終業後に当たる分だけを数える(終業後に出勤した夜の勤務などで、働いていない時間を数えないため)。
    return { early: Math.max(0, Math.min(std.start, end) - inMin), overtime: Math.max(0, end - Math.max(inMin, std.end)) };
  }
  // その日の早出・残業の分数(手で変えた値があればその値、なければ自動の値)。
  function dayEarlyOvertime(d, companyInfo) {
    const auto = autoEarlyOvertime(d, companyInfo);
    const early = (d.earlyMinutes === null || d.earlyMinutes === undefined || d.earlyMinutes === "") ? auto.early : Number(d.earlyMinutes) || 0;
    const overtime = (d.overtimeMinutes === null || d.overtimeMinutes === undefined || d.overtimeMinutes === "") ? auto.overtime : Number(d.overtimeMinutes) || 0;
    return { early, overtime, auto };
  }
  // 「1:30」「90」のどちらの書き方でも分数にする。読めなければnull。
  function parseDurationInput(v) {
    const t = String(v || "").trim();
    if (t === "") { return 0; }
    const hm = t.match(/^(\d{1,2}):(\d{1,2})$/);
    if (hm) { return parseInt(hm[1], 10) * 60 + parseInt(hm[2], 10); }
    if (/^\d+$/.test(t)) { return parseInt(t, 10); }
    return null;
  }

  // 22:00〜翌5:00と重なる分数を求める(日をまたぐ勤務はclockOut側に24時間分を足して扱う)。
  function nightOverlapMinutes(inMin, outMin) {
    if (inMin === null) return 0;
    if (outMin === null) return 0;
    let end = outMin;
    if (end <= inMin) { end += 1440; }
    const ranges = [[0, 300], [1320, 1440], [1440, 1740]];
    let total = 0;
    ranges.forEach(range => {
      const s = Math.max(inMin, range[0]);
      const e = Math.min(end, range[1]);
      if (e > s) { total += (e - s); }
    });
    return total;
  }

  // 対象月の勤怠区分の配列から、明細書の「勤怠」欄に必要な集計値をまとめて返す。
  function computeAttendanceSummary(days, companyInfo) {
    const info = companyInfo || {};
    const stdStartRaw = timeToMinutes(info.workStartTime);
    const stdEndRaw = timeToMinutes(info.workEndTime);
    const stdStart = stdStartRaw === null ? 9 * 60 : stdStartRaw;
    const stdEnd = stdEndRaw === null ? 18 * 60 : stdEndRaw;
    const breakMin = breakMinutesOf(info);
    const stdDailyMinutes = Math.max(0, stdEnd - stdStart - breakMin); // 所定労働時間 = 終了 − 開始 − 休憩

    let workedDays = 0, absentDays = 0, specialLeaveDays = 0, paidLeaveDays = 0, holidayWorkDays = 0;
    let actualMinutes = 0, lateEarlyMinutes = 0, holidayMinutes = 0, nightMinutes = 0;
    let earlyOvertimeMinutes = 0; // 勤怠の登録で選んだ早出・残業の合計(通常の日だけ)

    (days || []).forEach(d => {
      if (!d.dayType) { return; }
      if (d.dayType === "欠勤") { absentDays++; return; }
      if (d.dayType === "特休") { specialLeaveDays++; return; }
      if (d.dayType === "有休") { paidLeaveDays++; return; }
      const isHolidayWork = d.dayType === "休日出勤";
      if (isHolidayWork) { holidayWorkDays++; } else { workedDays++; }
      const range = dayClockRange(d, info); // 自社情報の時間の単位で丸めた出勤・退勤
      if (!range) { return; }
      const inMin = range.start % 1440;
      const end = range.end - (range.start - inMin);
      const outMin = end % 1440;
      const worked = workedMinutesAfterBreak(end - inMin, breakMin);
      actualMinutes += worked;
      if (end > inMin) { nightMinutes += nightOverlapMinutes(inMin, outMin); }
      if (isHolidayWork) {
        holidayMinutes += worked;
      } else {
        const eo = dayEarlyOvertime(d, info);
        earlyOvertimeMinutes += eo.early + eo.overtime;
        if (inMin > stdStart) { lateEarlyMinutes += (inMin - stdStart); }
        if (outMin < stdEnd) { lateEarlyMinutes += (stdEnd - outMin); }
      }
    });

    const scheduledDays = workedDays + absentDays + specialLeaveDays + paidLeaveDays;
    const scheduledMinutes = scheduledDays * stdDailyMinutes;
    const regularMinutes = actualMinutes - holidayMinutes;
    // 残業時間は、勤怠の登録で選んだ早出・残業の合計(自社情報の始業・終業時刻から自動で出し、日ごとに変更できる)。
    const overtimeMinutes = earlyOvertimeMinutes;

    return {
      scheduledDays, workedDays, absentDays, specialLeaveDays, paidLeaveDays, holidayWorkDays,
      scheduledMinutes, actualMinutes, lateEarlyMinutes, overtimeMinutes, holidayMinutes, nightMinutes,
      stdDailyMinutes,
    };
  }

  // 時給換算単価(月給・日給・時給いずれの雇用形態でも、割増賃金の計算に使う「時間単価」を出す)。
  function computeHourlyRate(staff, summary) {
    const stdDailyHours = (summary.stdDailyMinutes || 480) / 60;
    if (!staff) { return 0; }
    if (staff.wageType === "月給") {
      const monthlyStdHours = stdDailyHours * summary.scheduledDays;
      if (monthlyStdHours <= 0) { return 0; }
      return staff.wageRate / monthlyStdHours;
    }
    if (staff.wageType === "日給") {
      if (stdDailyHours <= 0) { return 0; }
      return staff.wageRate / stdDailyHours;
    }
    return staff.wageRate || 0;
  }

  // 基本給・残業手当・深夜手当・休日手当を計算する(自社情報の割増率を使用)。
  function computePaySummary(staff, summary, companyInfo) {
    const info = companyInfo || {};
    const hourlyRate = computeHourlyRate(staff, summary);
    const overtimeRate = Number(info.overtimeRate || 0) / 100;
    const nightRate = Number(info.nightRate || 0) / 100;
    const holidayRate = Number(info.holidayRate || 0) / 100;

    const overtimeHours = summary.overtimeMinutes / 60;
    const nightHours = summary.nightMinutes / 60;
    const holidayHours = summary.holidayMinutes / 60;

    const overtimePay = Math.round(hourlyRate * overtimeHours * (1 + overtimeRate));
    const nightPay = Math.round(hourlyRate * nightHours * nightRate);
    const holidayPay = Math.round(hourlyRate * holidayHours * (1 + holidayRate));

    let basicPay = 0;
    if (!staff) {
      basicPay = 0;
    } else if (staff.wageType === "月給") {
      basicPay = Math.round(staff.wageRate || 0);
    } else if (staff.wageType === "日給") {
      // 有給休暇の日も、通常の賃金(日給1日分)を支払う(労働基準法39条)。特休は会社の決まりによるため含めない。
      basicPay = Math.round((staff.wageRate || 0) * (summary.workedDays + (summary.paidLeaveDays || 0)));
    } else {
      const regularHours = Math.max(0, (summary.actualMinutes - summary.holidayMinutes) / 60 - overtimeHours);
      // 有給休暇の日は、所定労働時間(自社情報の始業〜終業)働いたものとして、通常の賃金を支払う。
      const paidLeaveHours = (summary.paidLeaveDays || 0) * ((summary.stdDailyMinutes || 480) / 60);
      basicPay = Math.round(hourlyRate * (regularHours + paidLeaveHours));
    }

    return { hourlyRate, basicPay, overtimePay, nightPay, holidayPay };
  }

  // 保険料額表・源泉所得税額表(月額表)の等級/区分を検索する(既存の計算パネルと同じロジック)。
  function lookupInsuranceTier(table, amount) {
    if (!table) { return null; }
    const tiers = table.tiers || [];
    const inRange = tiers.find(t => {
      const min = t.rangeMin === null || t.rangeMin === undefined ? -Infinity : t.rangeMin;
      const max = t.rangeMax === null || t.rangeMax === undefined ? Infinity : t.rangeMax;
      return amount >= min && amount < max;
    });
    if (inRange) { return inRange; }
    return tiers.find(t => {
      const min = t.rangeMin === null || t.rangeMin === undefined ? -Infinity : t.rangeMin;
      const max = t.rangeMax === null || t.rangeMax === undefined ? Infinity : t.rangeMax;
      return amount >= min && amount <= max;
    }) || null;
  }
  function lookupMonthlyTax(table, amount, isKou, dependents) {
    if (!table) { return null; }
    const data = table.data;
    if (data.belowMinimumThreshold !== null) {
      if (data.belowMinimumThreshold !== undefined) {
        if (amount < data.belowMinimumThreshold) {
          if (isKou) { return 0; }
          return Math.floor(amount * 0.03063);
        }
      }
    }
    if (amount >= data.maxAmount) { return null; }
    const bracket = data.brackets.find(b => {
      if (amount >= b.rangeMax) { return false; }
      return amount >= b.rangeMin;
    });
    if (!bracket) { return null; }
    if (!isKou) { return bracket.otsu; }
    const dep = Math.max(0, dependents || 0);
    if (dep > 7) {
      const over = dep - 7;
      return Math.max(0, bracket.kou[7] - over * 1610);
    }
    return bracket.kou[dep];
  }

  async function fetchAttendanceDaysFor(staffId, periodStart, periodEnd) {
    try {
      const res = await apiFetch(`${API_BASE}/attendance-month?staffId=${staffId}&periodStart=${periodStart}&periodEnd=${periodEnd}`);
      return res.ok ? await res.json() : [];
    } catch (e) { return []; }
  }

  async function fetchLeaveBalanceFor(staffId, asOf) {
    try {
      const res = await apiFetch(`${API_BASE}/leave-balance/${staffId}?asOf=${encodeURIComponent(asOf)}`);
      return res.ok ? await res.json() : null;
    } catch (e) { return null; }
  }

  // 年末調整を保存してあって、その反映月が対象月なら、過不足額(徴収はプラス・還付はマイナス)を返す。
  async function fetchYearEndAdjustment(staffId, year, month) {
    try {
      const res = await apiFetch(`${API_BASE}/year-end/${staffId}/${year}`);
      const rec = res.ok ? await res.json() : false;
      if (rec) { if (Number(rec.applyMonth) === Number(month)) { return Number(rec.adjustment) || 0; } }
    } catch (e) { /* 取得できなければ0 */ }
    return 0;
  }

  // 対象年の、対象月より前の給与明細書(保存済み)を合計し、累計額の下地を返す。
  async function fetchCumulativeTotals(staffId, year, month) {
    try {
      const res = await apiFetch(`${API_BASE}/payslips?staffId=${staffId}&year=${year}&beforeMonth=${month}`);
      const rows = res.ok ? await res.json() : [];
      let taxable = 0, gross = 0;
      rows.forEach(r => {
        const d = r.data || {};
        taxable += Number(d.taxableThisMonth || 0);
        gross += Number(d.grossPay || 0);
      });
      return { taxable, gross };
    } catch (e) { return { taxable: 0, gross: 0 }; }
  }

  // 支給・控除の内訳から、総支給額・課税対象額(当月分)・総控除額・差引支給額を計算する。
  function derivePayslipTotals(p) {
    const paymentItems = [
      { amount: p.basicPay, taxable: true },
      { amount: p.overtimePay, taxable: true },
      { amount: p.holidayPay, taxable: true },
      { amount: p.nightPay, taxable: true },
      { amount: p.commuteAllowance, taxable: p.commuteTaxable },
      { amount: p.qualificationAllowance, taxable: p.qualificationTaxable },
      { amount: p.positionAllowance, taxable: p.positionTaxable },
      { amount: p.housingAllowance, taxable: p.housingTaxable },
      { amount: p.familyAllowance, taxable: p.familyTaxable },
      { amount: p.other1Amount, taxable: p.other1Taxable },
      { amount: p.other2Amount, taxable: p.other2Taxable },
      { amount: p.other3Amount, taxable: p.other3Taxable },
    ];
    let grossPay = 0;
    let taxableThisMonth = 0;
    paymentItems.forEach(it => {
      const amt = Number(it.amount) || 0;
      grossPay += amt;
      if (it.taxable) { taxableThisMonth += amt; }
    });
    const deductionItems = [
      p.employmentInsurance, p.healthInsurance, p.careInsurance, p.pensionInsurance, p.childSupport,
      p.incomeTax, p.residentTax, p.lifeInsurance, p.wageSavings, p.stockOwnership,
      p.yearEndAdjustment, // 年末調整の過不足額(徴収はプラス、還付はマイナス)
    ];
    let totalDeduction = 0;
    deductionItems.forEach(v => { totalDeduction += Number(v) || 0; });
    const netPay = grossPay - totalDeduction;
    return { grossPay, taxableThisMonth, totalDeduction, netPay };
  }

  // 保険料額表の年度は4月始まり(3月分/4月納付分から切り替わる)。対象年月がどの年度に
  // 属するかを求める(1〜3月はその年の前年度扱い)。
  function fiscalYearForMonth(year, month) {
    if (month >= 4) { return year; }
    return year - 1;
  }

  // 自社情報の住所の先頭に含まれる都道府県名を取り出す(保険料額表の適用地域の自動判定に使用)。
  function extractPrefectureFromAddress(address) {
    if (!address) { return ""; }
    for (const p of PREFECTURES) {
      if (p === "全国一律") { continue; }
      if (address.indexOf(p) === 0) { return p; }
    }
    for (const p of PREFECTURES) {
      if (p === "全国一律") { continue; }
      if (address.indexOf(p) >= 0) { return p; }
    }
    return "";
  }

  // 自社情報の住所(都道府県)と、給与明細書の対象年月から、適用する保険料額表・
  // 源泉所得税額表(月額表)を自動選択する。一致する表が無ければ何もしない(手動選択のまま)。
  function autoSelectPayslipTables() {
    if (!state.companyInfo) { return; }
    const prefecture = extractPrefectureFromAddress(state.companyInfo.address);
    const insuranceFiscalYear = fiscalYearForMonth(state.payslipYear, state.payslipMonth);
    let insuranceMatch = null;
    if (prefecture) {
      insuranceMatch = state.tables.find(t => t.fiscalYear === insuranceFiscalYear && t.region === prefecture);
    }
    if (!insuranceMatch) {
      insuranceMatch = state.tables.find(t => t.fiscalYear === insuranceFiscalYear && t.region === "全国一律");
    }
    if (insuranceMatch) { state.payslipInsuranceTableId = String(insuranceMatch.id); }

    const taxMatch = state.taxTables.find(t => t.fiscalYear === state.payslipYear);
    if (taxMatch) { state.payslipTaxTableId = String(taxMatch.id); }
  }

  // 生年月日が未登録の従業員は介護保険料を判定できず0円になるため、その旨を明細の控除欄の下に出す。
  function kaigoNoticeHtml() {
    const st = STAFF.find(s => String(s.id) === String(state.payslipStaffId));
    if (!st) { return ""; }
    if (st.birthdate) { return ""; }
    return `<p class="table-card-sub" style="color:#b45309;">⚠ ${escapeHtml(st.name)}さんは生年月日が未登録のため、介護保険料を0円で計算しています。従業員登録ページで生年月日を入力してから、「再計算する」を押してください。</p>`;
  }

  // 生年月日と対象年月から、その月に介護保険第2号被保険者(40歳以上65歳未満)に該当するかを判定する。
  // 協会けんぽの扱いに合わせ、40歳に達する日(誕生日の前日)が属する月から、65歳に達する日が属する月の前月までを対象にする。
  function computeStaffIsKaigo(staff, year, month) {
    if (!staff) { return false; }
    if (!staff.birthdate) { return false; }
    const bd = new Date(staff.birthdate + "T00:00:00");
    if (isNaN(bd.getTime())) { return false; }
    const monthIndex = (y, m) => y * 12 + m;               // m: 0〜11
    const start = new Date(bd.getFullYear() + 40, bd.getMonth(), bd.getDate() - 1);
    const end = new Date(bd.getFullYear() + 65, bd.getMonth(), bd.getDate() - 1);
    const target = monthIndex(year, month - 1);
    return target >= monthIndex(start.getFullYear(), start.getMonth()) && target < monthIndex(end.getFullYear(), end.getMonth());
  }

  // 自社情報の締め日設定から、対象年月に対応する勤怠集計期間を計算する。
  // 締め日が「末日」なら暦月そのまま(1日〜末日)。日数(1〜31)なら「前月の(締め日+1)日〜当月の締め日」。
  function computePayrollPeriod(companyInfo, year, month) {
    const cutoff = (companyInfo || {}).payrollCutoffDay || "末日";
    const pad2 = n => String(n).padStart(2, "0");
    const fmt = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    if (cutoff === "末日") {
      const start = new Date(year, month - 1, 1);
      const end = new Date(year, month, 0);
      return { periodStart: fmt(start), periodEnd: fmt(end) };
    }
    const cutoffDay = Math.max(1, Math.min(31, Number(cutoff) || 31));
    const lastOfMonth = new Date(year, month, 0).getDate();
    const endDay = Math.min(cutoffDay, lastOfMonth);
    const end = new Date(year, month - 1, endDay);
    const start = new Date(year, month - 1, endDay);
    start.setMonth(start.getMonth() - 1);
    start.setDate(start.getDate() + 1);
    return { periodStart: fmt(start), periodEnd: fmt(end) };
  }

  // 自社情報の支払月・支払日設定から、対象年月の給与支払日(明細書に印字する目安)を計算する。
  function computePayrollPaymentDate(companyInfo, year, month) {
    const offsetMonths = companyInfo ? Number(companyInfo.payrollPaymentOffsetMonths || 0) : 0;
    const payDaySetting = (companyInfo || {}).payrollPaymentDay || "末日";
    const pad2 = n => String(n).padStart(2, "0");
    const base = new Date(year, month - 1 + offsetMonths, 1);
    const payYear = base.getFullYear();
    const payMonth = base.getMonth() + 1;
    const lastOfPayMonth = new Date(payYear, payMonth, 0).getDate();
    const day = payDaySetting === "末日" ? lastOfPayMonth : Math.min(Math.max(1, Number(payDaySetting) || 1), lastOfPayMonth);
    return `${payYear}-${pad2(payMonth)}-${pad2(day)}`;
  }

  // 勤怠・従業員マスタ・保険料額表/源泉所得税額表・有休残日数・累計額から、
  // 給与明細書の初期値(自動計算)を組み立てる。保存前に管理者が内容を確認・修正できる。
  async function buildDefaultPayslip(staffId, year, month) {
    const staff = STAFF.find(s => s.id === String(staffId));
    if (!staff) { return null; }
    if (!state.companyInfo) { await loadCompanyInfoForPayroll(); }
    const { periodStart, periodEnd } = computePayrollPeriod(state.companyInfo, year, month);
    const paymentDate = computePayrollPaymentDate(state.companyInfo, year, month);
    const days = await fetchAttendanceDaysFor(staffId, periodStart, periodEnd);
    const summary = computeAttendanceSummary(days, state.companyInfo);
    const pay = computePaySummary(staff, summary, state.companyInfo);
    const balance = await fetchLeaveBalanceFor(staffId, periodEnd);
    const cumulative = await fetchCumulativeTotals(staffId, year, month);

    const insuranceTable = state.tables.find(t => String(t.id) === String(state.payslipInsuranceTableId));
    const taxTable = state.taxTables.find(t => String(t.id) === String(state.payslipTaxTableId));
    const grossForInsurance = pay.basicPay + pay.overtimePay + pay.holidayPay + pay.nightPay
      + staff.commuteAllowance + staff.qualificationAllowance + staff.positionAllowance
      + staff.housingAllowance + staff.familyAllowance
      + staff.other1Amount + staff.other2Amount + staff.other3Amount;
    const tier = lookupInsuranceTier(insuranceTable, grossForInsurance);
    // 保険料額表の金額は小数が混じることがあるため、円未満は「50銭以下切り捨て・50銭超切り上げ」で整える。
    const roundYen = v => Math.ceil(Number(v || 0) - 0.5 - 0.000001);
    const baseHealth = tier ? roundYen(tier.healthInsurance) : 0;
    const combinedWithKaigo = tier ? roundYen(tier.healthInsuranceWithKaigo) : 0;
    const healthInsurance = baseHealth;
    const isKaigo = computeStaffIsKaigo(staff, year, month);
    const careInsurance = isKaigo ? Math.max(0, combinedWithKaigo - baseHealth) : 0;
    // 子ども・子育て支援金(2026年4月分〜): 保険料額表の「子ども・子育て支援金」の折半額(本人負担分)を、全員に適用する。
    const childSupport = tier ? roundYen(tier.kodomoSupport) : 0;
    const pensionInsurance = tier ? roundYen(tier.pensionInsurance) : 0;
    const industry = state.companyInfo ? state.companyInfo.employmentInsuranceIndustry : "";
    const insuranceRateEntry = EMPLOYMENT_INSURANCE_RATES[industry];
    const employmentInsurance = insuranceRateEntry
      ? Math.floor(grossForInsurance * insuranceRateEntry.employeeRate)
      : staff.employmentInsuranceFixed;

    const taxableForIncome = Math.max(0, grossForInsurance - healthInsurance - careInsurance - childSupport - pensionInsurance - employmentInsurance);
    const incomeTaxRaw = lookupMonthlyTax(taxTable, taxableForIncome, true, staff.dependents);
    const incomeTax = incomeTaxRaw === null ? 0 : incomeTaxRaw;
    const yearEndAdjustment = await fetchYearEndAdjustment(staffId, year, month);

    return {
      companyName: state.companyInfo ? state.companyInfo.name : "",
      periodStart, periodEnd, paymentDate,
      staffName: staff.name, employeeNumber: staff.employeeNumber, department: staff.dept,
      scheduledDays: summary.scheduledDays, workedDays: summary.workedDays, absentDays: summary.absentDays,
      specialLeaveDays: summary.specialLeaveDays, paidLeaveDays: summary.paidLeaveDays,
      paidLeaveRemaining: balance ? balance.remaining : 0,
      scheduledMinutes: summary.scheduledMinutes, lateEarlyMinutes: summary.lateEarlyMinutes,
      actualMinutes: summary.actualMinutes, overtimeMinutes: summary.overtimeMinutes,
      holidayMinutes: summary.holidayMinutes, nightMinutes: summary.nightMinutes,
      basicPay: pay.basicPay, overtimePay: pay.overtimePay, holidayPay: pay.holidayPay, nightPay: pay.nightPay,
      commuteAllowance: staff.commuteAllowance, commuteTaxable: staff.commuteTaxable,
      qualificationAllowance: staff.qualificationAllowance, qualificationTaxable: staff.qualificationTaxable,
      positionAllowance: staff.positionAllowance, positionTaxable: staff.positionTaxable,
      housingAllowance: staff.housingAllowance, housingTaxable: staff.housingTaxable,
      familyAllowance: staff.familyAllowance, familyTaxable: staff.familyTaxable,
      other1Label: staff.other1Label, other1Amount: staff.other1Amount, other1Taxable: staff.other1Taxable,
      other2Label: staff.other2Label, other2Amount: staff.other2Amount, other2Taxable: staff.other2Taxable,
      other3Label: staff.other3Label, other3Amount: staff.other3Amount, other3Taxable: staff.other3Taxable,
      employmentInsurance, healthInsurance, careInsurance, pensionInsurance, childSupport, incomeTax, yearEndAdjustment,
      residentTax: staff.residentTaxFixed, lifeInsurance: staff.lifeInsuranceFixed,
      wageSavings: staff.wageSavingsFixed, stockOwnership: staff.stockOwnershipFixed,
      dependents: staff.dependents,
      taxableCumulativePrev: cumulative.taxable, grossCumulativePrev: cumulative.gross,
    };
  }

  // ============================================================
  // Excel読み取り(SheetJSで先にブラウザ側で解析する)。
  // 列見出しに含まれるキーワードで列を探すため、列の並び順は自由。
  // 対応する見出しキーワード:
  //   等級      … 「等級」
  //   標準報酬月額 … 「標準報酬」
  //   報酬月額下限 … 「下限」または「以上」
  //   報酬月額上限 … 「上限」または「未満」
  //   健康保険料(従業員負担) … 「健康保険」
  //   厚生年金保険料(従業員負担) … 「厚生年金」
  // ============================================================
  function toHalfWidthDigits(s) {
    return String(s).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
  }
  function parseNumberCell(v) {
    if (v === null || v === undefined || v === "") return null;
    if (typeof v === "number") return v;
    const cleaned = toHalfWidthDigits(String(v)).replace(/[¥,円\s]/g, "");
    if (cleaned === "" || cleaned === "-") return null;
    const n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }
  function findColumnIndex(headerRow, keywords) {
    for (let i = 0; i < headerRow.length; i++) {
      const h = String(headerRow[i] || "");
      if (keywords.some(k => h.includes(k))) return i;
    }
    return -1;
  }
  function parseInsuranceExcel(workbook) {
    const sheetName = workbook.SheetNames[0];
    const ws = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });

    let headerRowIdx = -1, cols = null;
    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const idxStd = findColumnIndex(row, ["標準報酬"]);
      if (idxStd === -1) continue;
      cols = {
        grade: findColumnIndex(row, ["等級"]),
        standard: idxStd,
        min: findColumnIndex(row, ["下限", "以上"]),
        max: findColumnIndex(row, ["上限", "未満"]),
        health: findColumnIndex(row, ["健康保険"]),
        pension: findColumnIndex(row, ["厚生年金"]),
      };
      headerRowIdx = i;
      break;
    }
    if (headerRowIdx === -1) {
      throw new Error("見出し行(「標準報酬月額」を含む列)が見つかりませんでした。テンプレートをご確認ください。");
    }
    if (cols.health === -1) {
      if (cols.pension === -1) {
        throw new Error("「健康保険」または「厚生年金」の列が見つかりませんでした。テンプレートをご確認ください。");
      }
    }

    const tiers = [];
    for (let i = headerRowIdx + 1; i < rows.length; i++) {
      const row = rows[i];
      const standard = parseNumberCell(row[cols.standard]);
      if (standard === null) continue;
      tiers.push({
        grade: cols.grade !== -1 ? String(row[cols.grade] || "") : "",
        standardAmount: standard,
        rangeMin: cols.min !== -1 ? parseNumberCell(row[cols.min]) : null,
        rangeMax: cols.max !== -1 ? parseNumberCell(row[cols.max]) : null,
        healthInsurance: cols.health !== -1 ? (parseNumberCell(row[cols.health]) || 0) : 0,
        pensionInsurance: cols.pension !== -1 ? (parseNumberCell(row[cols.pension]) || 0) : 0,
      });
    }
    if (tiers.length === 0) {
      throw new Error("等級データを読み取れませんでした。テンプレートをご確認ください。");
    }
    return tiers;
  }

  // 国税庁・協会けんぽの公式Excelは、A列にまったくデータが無いシート(印刷範囲が
  // B列から始まる場合など)だと、SheetJSがA列を「存在しない列」として詰めてしまい、
  // header:1で得られる配列の0番目がB列の中身になる(=すべての列位置が1つずつ
  // ずれる)ことがある。列位置を固定指定するパーサーはすべて、シートの実際の
  // 開始列(!refの左端)を調べてズレを補正してから読み取る。
  function getColOffset(ws) {
    if (!ws["!ref"]) return 0;
    try {
      return XLSX.utils.decode_range(ws["!ref"]).s.c;
    } catch (e) {
      return 0;
    }
  }

  // 協会けんぽの公式「保険料額表」用の固定位置パーサー。
  // 見出しが複数行にまたがる決まった様式(11行目からデータ開始)のため、
  // キーワード検索ではなく列位置を直接指定して読み取る。
  //   A:等級  B:標準報酬月額  C:報酬月額下限  D:(～、読み飛ばし)  E:報酬月額上限
  //   F:健康保険料(介護保険非該当・全額)  G:同(折半額)
  //   H:健康保険料(介護保険該当・全額)    I:同(折半額)
  //   J:子ども・子育て支援金(全額)        K:同(折半額)
  //   L:厚生年金保険料(全額)              M:同(折半額)
  function parseKyokaiKenpoSheet(ws) {
    const colOffset = getColOffset(ws);
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
    const tiers = [];
    for (let i = 10; i < rows.length; i++) {
      const row = rows[i];
      const standard = parseNumberCell(row[1 - colOffset]);
      if (standard === null) break;
      tiers.push({
        grade: String(row[0 - colOffset] || ""),
        standardAmount: standard,
        rangeMin: parseNumberCell(row[2 - colOffset]),
        rangeMax: parseNumberCell(row[4 - colOffset]),
        healthInsurance: parseNumberCell(row[6 - colOffset]) || 0,
        healthInsuranceWithKaigo: parseNumberCell(row[8 - colOffset]) || 0,
        kodomoSupport: parseNumberCell(row[10 - colOffset]) || 0,
        pensionInsurance: parseNumberCell(row[12 - colOffset]) || 0,
      });
    }
    if (tiers.length === 0) {
      throw new Error("この様式の保険料額表からデータを読み取れませんでした。");
    }
    return tiers;
  }

  // 国税庁の公式「給与所得の源泉徴収税額表(月額表)」用の固定位置パーサー。
  // 列位置: A(読み飛ばし・行番号) B:報酬月額以上 C:報酬月額未満
  //         D〜K:甲欄(扶養親族等の数0〜7人)  L:乙欄
  // 通常の行はA列が数値(連番)。空行はスキップする(表内に間引き用の空行がある)。
  // 105,000円未満の特例行は、A列が空でC列が「未満」を含む文字列。
  // 表の最終行(「740,000円」のような文字列の1行)に達したら読み取りを終了する
  // (それ以降は「○○円を超える金額の○○%」という数式表記になり、単純な行では表せないため)。
  function parseWithholdingTaxSheet(ws) {
    const colOffset = getColOffset(ws);
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
    const brackets = [];
    let belowMinimumThreshold = null;

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const seqId = row[0 - colOffset];
      const lower = row[1 - colOffset];
      const upper = row[2 - colOffset];

      if (typeof lower === "number") {
        if (typeof upper === "string") {
          if (upper.includes("未満")) {
            belowMinimumThreshold = lower;
          }
          continue;
        }
      }

      if (typeof seqId !== "number") continue;
      if (typeof lower !== "number") continue;
      if (typeof upper !== "number") continue;

      const kou = [];
      for (let k = 0; k < 8; k++) {
        kou.push(parseNumberCell(row[3 + k - colOffset]) || 0);
      }
      brackets.push({
        rangeMin: lower,
        rangeMax: upper,
        kou: kou,
        otsu: parseNumberCell(row[11 - colOffset]) || 0,
      });
    }

    if (brackets.length === 0) {
      throw new Error("見出しや列の並びが対応していない様式です。国税庁の公式Excel(月額表)をそのままアップロードしてください。");
    }
    return {
      brackets: brackets,
      belowMinimumThreshold: belowMinimumThreshold,
      maxAmount: brackets[brackets.length - 1].rangeMax,
    };
  }

  // 国税庁の公式「給与所得の源泉徴収税額表(日額表)」用の固定位置パーサー。
  // 月額表と同じ列構成(A:行番号 B:以上 C:未満 D〜K:甲欄0〜7人 L:乙欄)に加え、
  // M列に日雇労働者向けの丙欄がある。単位はそのまま円(倍率なし)。
  function parseDailyWithholdingTaxSheet(ws) {
    const colOffset = getColOffset(ws);
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
    const brackets = [];
    let belowMinimumThreshold = null;

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const seqId = row[0 - colOffset];
      const lower = row[1 - colOffset];
      const upper = row[2 - colOffset];

      if (typeof lower === "number") {
        if (typeof upper === "string") {
          if (upper.includes("未満")) {
            belowMinimumThreshold = lower;
          }
          continue;
        }
      }

      if (typeof seqId !== "number") continue;
      if (typeof lower !== "number") continue;
      if (typeof upper !== "number") continue;

      const kou = [];
      for (let k = 0; k < 8; k++) {
        kou.push(parseNumberCell(row[3 + k - colOffset]) || 0);
      }
      brackets.push({
        rangeMin: lower,
        rangeMax: upper,
        kou: kou,
        otsu: parseNumberCell(row[11 - colOffset]) || 0,
        hei: parseNumberCell(row[12 - colOffset]) || 0,
      });
    }

    if (brackets.length === 0) {
      throw new Error("見出しや列の並びが対応していない様式です。国税庁の公式Excel(日額表)をそのままアップロードしてください。");
    }
    return {
      brackets: brackets,
      belowMinimumThreshold: belowMinimumThreshold,
      maxAmount: brackets[brackets.length - 1].rangeMax,
    };
  }

  // 国税庁の公式「賞与に対する源泉徴収税額の算出率の表」用の固定位置パーサー。
  // 表の単位は千円のため、読み取り時に1000倍して円に正規化する。
  // 列位置: B:算出率(%)  D〜S:甲欄(扶養親族等0〜7人以上、各2列で以上/未満のペア)
  //         T,U:乙欄(以上/未満)。乙欄は一部の行にしかデータがない。
  // 上限が無い最終行は「○○千円以上」という文字列になるため、その場合はrangeMaxをnull(無制限)にする。
  // 最初の行は「○○千円未満」で率0%のケースがあり、その場合はrangeMinを0として扱う。
  function parseBonusTaxSheet(ws) {
    const colOffset = getColOffset(ws);
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: "" });
    const kouBrackets = [[], [], [], [], [], [], [], []];
    const otsuBrackets = [];

    function boundary(lowerRaw, upperRaw) {
      if (lowerRaw === "") { if (upperRaw === "") return null; }
      if (typeof upperRaw === "string") {
        if (upperRaw.includes("未満")) {
          const m = parseNumberCell(lowerRaw);
          return m === null ? null : { min: 0, max: m * 1000 };
        }
        if (upperRaw.includes("以上")) {
          const m = parseNumberCell(lowerRaw);
          return m === null ? null : { min: m * 1000, max: null };
        }
        return null;
      }
      const min = parseNumberCell(lowerRaw);
      const max = parseNumberCell(upperRaw);
      if (min === null) return null;
      if (max === null) return null;
      return { min: min * 1000, max: max * 1000 };
    }

    for (let i = 0; i < rows.length; i++) {
      const row = rows[i];
      const rate = parseNumberCell(row[1 - colOffset]);
      if (rate === null) continue;

      for (let d = 0; d < 8; d++) {
        const b = boundary(row[3 + d * 2 - colOffset], row[4 + d * 2 - colOffset]);
        if (b) {
          kouBrackets[d].push({ rangeMin: b.min, rangeMax: b.max, rate: rate });
        }
      }
      const ob = boundary(row[19 - colOffset], row[20 - colOffset]);
      if (ob) {
        otsuBrackets.push({ rangeMin: ob.min, rangeMax: ob.max, rate: rate });
      }
    }

    const totalKou = kouBrackets.reduce((sum, arr) => sum + arr.length, 0);
    if (totalKou === 0) {
      throw new Error("見出しや列の並びが対応していない様式です。国税庁の公式Excel(賞与に対する源泉徴収税額の算出率の表)をそのままアップロードしてください。");
    }
    return { kouBrackets: kouBrackets, otsuBrackets: otsuBrackets };
  }

    setDailyCalcField(key, val) {
      state.dailyCalc[key] = val;
      state.dailyCalcResult = null;
      state.dailyCalcError = "";
      if (key === "staffId") {
        const staff = STAFF.find(s => s.id === val);
        if (staff && staff.wageType === "日給" && staff.wageRate) {
          state.dailyCalc.amount = String(staff.wageRate);
        }
      }
      render();
    },
    setDailyCalcCategory(category) {
      state.dailyCalc.category = category;
      state.dailyCalcResult = null;
      state.dailyCalcError = "";
      render();
    },
    runDailyCalc() {
      state.dailyCalcResult = null;
      state.dailyCalcError = "";
      const table = state.dailyTables.find(t => String(t.id) === String(state.dailyCalc.tableId));
      const amount = Number(state.dailyCalc.amount);
      if (!table) { state.dailyCalcError = "対象年度の源泉所得税額表(日額表)を選択してください。"; render(); return; }
      if (!amount || amount <= 0) { state.dailyCalcError = "対象金額を入力してください。"; render(); return; }
      const data = table.data;

      if (data.belowMinimumThreshold !== null) {
        if (data.belowMinimumThreshold !== undefined) {
          if (amount < data.belowMinimumThreshold) {
            if (state.dailyCalc.category === "otsu") {
              state.dailyCalcResult = { special: true, amount: Math.floor(amount * 0.03063) };
            } else {
              state.dailyCalcResult = { amount: 0 };
            }
            render();
            return;
          }
        }
      }
      if (amount >= data.maxAmount) {
        state.dailyCalcError = `対象金額が表の範囲(${yen(data.maxAmount)}まで)を超えています。この金額は速算式での計算が必要なため、国税庁の資料をご確認のうえ手計算してください。`;
        render();
        return;
      }
      const bracket = data.brackets.find(b => amount >= b.rangeMin && amount < b.rangeMax);
      if (!bracket) {
        state.dailyCalcError = "該当する区分が見つかりませんでした(金額が表の範囲外です)。";
        render();
        return;
      }
      if (state.dailyCalc.category === "otsu") {
        state.dailyCalcResult = { amount: bracket.otsu };
        render();
        return;
      }
      if (state.dailyCalc.category === "hei") {
        state.dailyCalcResult = { amount: bracket.hei };
        render();
        return;
      }
      const dependents = Math.max(0, parseInt(state.dailyCalc.dependents, 10) || 0);
      if (dependents <= 7) {
        state.dailyCalcResult = { amount: bracket.kou[dependents] };
      } else {
        const over = dependents - 7;
        state.dailyCalcResult = { amount: Math.max(0, bracket.kou[7] - over * 50), extraDependents: over };
      }
      render();
    },

      state.bulkPrinting = true;
      state.payslip = null;
      state.yearEndPrint = false;
      render();
      const results = [];
      let usedSaved = 0, newlySaved = 0, saveFailed = 0, skippedNoPay = 0;
      for (const staff of STAFF) {
        let p = null;
        try {
          const res = await apiFetch(`${API_BASE}/payslips/${staff.id}/${state.payslipYear}/${state.payslipMonth}`);
          if (res.ok) {
            const saved = await res.json().catch(() => null);
            if (saved) { p = saved.data; }
          }
        } catch (e) { /* 保存済みが無ければ自動計算にフォールバックする */ }
        if (p) {
          usedSaved++;
        } else {
          try {
            p = await buildDefaultPayslip(staff.id, state.payslipYear, state.payslipMonth);
          } catch (e) { p = null; }
          if (p) {
            // 自動計算した内容は、印刷するだけでなく保存もする(従業員本人の「有給照会」ページに反映される)。
            p = Object.assign({}, p, derivePayslipTotals(p));
            if (!(p.grossPay > 0)) {
              // 給与形態・単価が未設定で総支給額が0円の従業員は、意味のない明細を残さないよう保存しない(印刷だけする)。
              skippedNoPay++;
            } else try {
              const saveRes = await apiFetch(`${API_BASE}/payslips/${staff.id}/${state.payslipYear}/${state.payslipMonth}`, {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  staffName: p.staffName, department: p.department, employeeNumber: p.employeeNumber,
                  periodStart: p.periodStart, periodEnd: p.periodEnd, data: p,
                }),
              });
              if (saveRes.ok) { newlySaved++; } else { saveFailed++; }
            } catch (e) { saveFailed++; }
          }
        }
        if (p) { results.push(p); }
      }
      state.bulkPayslips = results;
      state.bulkPrinting = false;
      state.payslipMsg = `全員分を印刷します(保存済みを使用: ${usedSaved}名 / 自動計算して保存: ${newlySaved}名${skippedNoPay > 0 ? ` / 給与未設定のため保存せず: ${skippedNoPay}名` : ""}${saveFailed > 0 ? ` / 保存に失敗: ${saveFailed}名` : ""})。`;
      render();
      if (results.length > 0) {
        window.print();
      } else {
        alert("印刷できる明細書がありませんでした。");
      }
    },
  };

  function renderBonusBracketsTable(data) {
    const rows = [];

    for (let i = 0; i < rowCount; i++) {
      const cells = data.kouBrackets.map(arr => {
        const b = arr[i];
        if (!b) return "<td>-</td>";
        return `<td>${yen(b.rangeMin)}〜${b.rangeMax===null?"":yen(b.rangeMax)}<br>${b.rate}%</td>`;
      }).join("");
      const ob = data.otsuBrackets[i];
      const otsuCell = ob ? `<td>${yen(ob.rangeMin)}〜${ob.rangeMax===null?"":yen(ob.rangeMax)}<br>${ob.rate}%</td>` : "<td>-</td>";
      rows.push(`<tr>${cells}${otsuCell}</tr>`);
    }
    return `
      <table class="preview-table">
        <thead><tr><th>甲0人</th><th>1人</th><th>2人</th><th>3人</th><th>4人</th><th>5人</th><th>6人</th><th>7人以上</th><th>乙欄</th></tr></thead>

  // 勤怠の表の、早出・残業の欄(チェック+時間)。通常の日だけ選べる。手で変えた欄は色を付ける。
  function attExtraCell(d, key, mins) {
    if (d.dayType !== "通常") { return `<td class="ot-cell">-</td>`; }
    const manual = d[key] !== null ? d[key] !== undefined : false;
    return `<td class="ot-cell${manual ? " manual" : ""}">
      <label><input type="checkbox" ${mins > 0 ? "checked" : ""} onchange="__kyuyo.toggleAttExtra('${d.date}', '${key}', this.checked)"></label>
      <input type="text" value="${mins > 0 ? minutesToHM(mins) : ""}" placeholder="0:00" onchange="__kyuyo.setAttExtraTime('${d.date}', '${key}', this.value)">
    </td>`;
  }

  // 有休消化日数の詳細: 有休を使った日(勤怠で区分を「有休」にした日)と、どの付与分から使ったか。
  function renderLeaveUsedDetail(balance) {
    const list = balance ? (balance.usedDetails || []) : [];
    if (list.length === 0) {
      return `<div class="used-detail">有休を使った日はまだありません(給与計算の「勤怠(日ごとの区分)の登録」で区分を「有休」にした日が数えられます)。</div>`;
    }
    return `<div class="used-detail">${list.slice().reverse().map(u => {
      const dow = WEEKDAY_LABELS[new Date(u.date + "T00:00:00").getDay()];
      const from = u.grantDate ? `${escapeHtml(u.grantDate)}付与分から` : "使える付与なし";
      return `<div><span>${escapeHtml(u.date)}(${dow})</span><span style="color:${u.grantDate ? "#6b7280" : "#b91c1c"};">${from}</span></div>`;
    }).join("")}</div>`;
  }

  // 開いている明細書(従業員・年・月)の保存履歴をサーバーから取得する。
  async function loadPayslipHistory() {
    const h = state.payslipHistory;
    h.loading = true; h.error = ""; render();
    try {
      const res = await apiFetch(`${API_BASE}/payslips/${state.payslipStaffId}/${state.payslipYear}/${state.payslipMonth}/history`);
      const data = await res.json().catch(() => null);
      if (!res.ok) { throw new Error((data && data.message) ? data.message : "履歴を取得できませんでした。"); }
      h.items = Array.isArray(data) ? data : [];
    } catch (e) {
      h.items = []; h.error = e.message || "履歴を取得できませんでした。";
    }
    h.loading = false;
    render();
  }

  // 履歴1件分の主な内容(0円でない項目だけ)を、見やすい一覧にする。
  function historyDetailHtml(d) {
    if (!d) { return ""; }
    const fields = [
      ["基本給", "basicPay"], ["残業手当", "overtimePay"], ["休日手当", "holidayPay"], ["夜勤手当", "nightPay"],
      ["通勤手当", "commuteAllowance"], ["資格手当", "qualificationAllowance"], ["役職手当", "positionAllowance"],
      ["住宅手当", "housingAllowance"], ["家族手当", "familyAllowance"],
      ["雇用保険", "employmentInsurance"], ["健康保険", "healthInsurance"], ["介護保険", "careInsurance"], ["厚生年金", "pensionInsurance"],
      ["子ども・子育て支援金", "childSupport"], ["所得税", "incomeTax"], ["住民税", "residentTax"],
      ["生命保険", "lifeInsurance"], ["財形貯蓄", "wageSavings"], ["従業員持株会", "stockOwnership"],
      ["年末調整", "yearEndAdjustment"],
    ];
    const extra = [1, 2, 3].map(n => [d[`other${n}Label`] || `その他${n}`, `other${n}Amount`]);
    return fields.concat(extra)
      .filter(([label, key]) => Number(d[key] || 0) !== 0)
      .map(([label, key]) => `<span class="ps-hist-item">${escapeHtml(label)} <b>${yen(d[key])}</b></span>`).join("");
  }

  function renderPayslipHistory() {
    const h = state.payslipHistory;
    const key = `${state.payslipStaffId}-${state.payslipYear}-${state.payslipMonth}`;
    const open = h.open ? (h.key === key) : false;
    const toggle = `<button type="button" class="btn-link" onclick="__kyuyo.toggleHistory()">${open ? "▲ 保存履歴を閉じる" : "▼ 保存履歴を見る(上書き・削除される前の内容)"}</button>`;
    if (!open) { return `<div class="ps-hist">${toggle}</div>`; }
    const body = h.loading ? `<p class="table-card-sub">読み込み中…</p>`
      : h.error ? `<p class="msg err">${escapeHtml(h.error)}</p>`
      : h.items.length === 0 ? `<p class="table-card-sub">この明細書に、上書き・削除される前の履歴はありません(内容を変えて保存し直すと、ここに残ります)。</p>`
      : `<div class="ps-hist-list">${h.items.map(it => {
          const d = it.data || {};
          const t = derivePayslipTotals(d);
          return `
            <div class="ps-hist-row">
              <div class="ps-hist-head">
                <span><b>${escapeHtml(it.replacedAt || "")}</b> に ${escapeHtml(it.replacedBy || "(不明)")} が${escapeHtml(it.reason || "更新")}</span>
                <span class="ps-hist-sub">この内容の保存日時: ${escapeHtml(it.savedAt || "-")}</span>
              </div>
              <div class="ps-hist-total">総支給 <b>${yen(t.grossPay)}</b> ／ 総控除 <b>${yen(t.totalDeduction)}</b> ／ 差引支給 <b>${yen(t.netPay)}</b></div>
              <details><summary>内容を見る</summary><div class="ps-hist-items">${historyDetailHtml(d)}</div></details>
              <button type="button" class="btn-secondary ps-hist-btn" onclick="__kyuyo.restoreHistory(${it.id})">この内容を画面に読み込む</button>
            </div>`;
        }).join("")}</div>`;
    return `<div class="ps-hist">${toggle}${body}</div>`;
  }

  // 全員分を一括印刷するとき用の、1人分を大きく省略した明細カード(A4に8人分並べるための簡易版)。
  function renderMiniPayslip(p) {
    const totals = derivePayslipTotals(p);
    const allowanceTotal = Number(p.holidayPay || 0) + Number(p.nightPay || 0) + Number(p.commuteAllowance || 0)
      + Number(p.qualificationAllowance || 0) + Number(p.positionAllowance || 0) + Number(p.housingAllowance || 0)
      + Number(p.familyAllowance || 0) + Number(p.other1Amount || 0) + Number(p.other2Amount || 0) + Number(p.other3Amount || 0);
    const socialInsuranceTotal = Number(p.employmentInsurance || 0) + Number(p.healthInsurance || 0)
      + Number(p.careInsurance || 0) + Number(p.pensionInsurance || 0) + Number(p.childSupport || 0);
    const taxTotal = Number(p.incomeTax || 0) + Number(p.residentTax || 0);
    const otherDeductionTotal = Number(p.lifeInsurance || 0) + Number(p.wageSavings || 0) + Number(p.stockOwnership || 0);
    const miniCell = (label, value) => `<div class="ps-mini-cell"><label>${escapeHtml(label)}</label><span>${escapeHtml(value)}</span></div>`;
    return `
      <div class="ps-mini-card">
        <div class="ps-mini-head">
          <span class="ps-mini-title">${p.periodStart ? p.periodStart.slice(0,4) : ""}年${p.periodStart ? Number(p.periodStart.slice(5,7)) : ""}月分 給与明細書・${escapeHtml(p.companyName)}${sealImgHtml(26)}</span>
          <span class="ps-mini-staff">${escapeHtml(p.staffName)}(社員番号: ${escapeHtml(p.employeeNumber == null || p.employeeNumber === "" ? "" : String(p.employeeNumber).padStart(3, "0"))})</span>
          <span class="ps-mini-net">差引支給額 <b>${yen(totals.netPay)}</b></span>
        </div>
        <div class="ps-mini-grid">
          ${miniCell("基本給", yen(p.basicPay))}
          ${miniCell("残業手当", yen(p.overtimePay))}
          ${miniCell("諸手当計", yen(allowanceTotal))}
          ${miniCell("総支給額", yen(totals.grossPay))}
          ${miniCell("社会保険計", yen(socialInsuranceTotal))}
          ${miniCell("税金計", yen(taxTotal))}

          ${miniCell("総控除額", yen(totals.totalDeduction))}

  // 全従業員分を、A4用紙1枚につき8人分ずつまとめた印刷用ビューを組み立てる。
  function renderBulkPayslipPrintView() {
    if (!state.bulkPayslips) { return `<div id="kyuyo-print-view"></div>`; }
    if (state.bulkPayslips.length === 0) { return `<div id="kyuyo-print-view"></div>`; }
    const groups = [];
    for (let i = 0; i < state.bulkPayslips.length; i += 8) {
      groups.push(state.bulkPayslips.slice(i, i + 8));
    }
    return `
      <div id="kyuyo-print-view">
        ${groups.map(group => `
          <div class="ps-mini-page">
            ${group.map(p => renderMiniPayslip(p)).join("")}
          </div>
        `).join("")}
      </div>`;
  }

  // ============================================================
  // 年末調整の計算(令和7年分以降の所得税の制度に基づく)
  // ※この範囲では論理積(アンパサンド2つ)を使わない(WordPressの表示処理が、山かっこの間にある記号を壊すことがあるため)。
  // ============================================================
  const YE_TAX_NOTE = "令和7年度税制改正(給与所得控除の最低保障65万円・基礎控除の見直し等)に基づく計算です。令和8年度以降の改正や、個別の事情(他の所得がある・特例の適用など)は反映していないため、給与所得控除後の金額・基礎控除額は手入力で上書きできます。最終的な確認は国税庁の「年末調整のしかた」で行ってください。";
  function yeNum(v) {
    const n = Math.floor(Number(String(v === undefined || v === null ? "" : v).replace(/[^0-9.]/g, "")) || 0);
    return Math.max(0, n);
  }
  // 給与所得控除後の給与等の金額。収入が660万円未満(かつ190万円超)のときは、国税庁の別表と同じく4,000円単位に切り捨てて計算する。
  function yeSalaryIncome(wages) {
    const w = Math.max(0, Math.floor(wages));
    if (w === 0) { return 0; }
    if (w <= 1900000) { return Math.max(0, w - 650000); }
    const a = (w < 6600000) ? Math.floor(w / 4000) * 4000 : w;
    let ded = 1950000;
    if (a <= 3600000) { ded = a * 0.3 + 80000; }
    else if (a <= 6600000) { ded = a * 0.2 + 440000; }
    else if (a <= 8500000) { ded = a * 0.1 + 1100000; }
    return Math.max(0, Math.floor(a - ded));
  }
  // 基礎控除(令和7・8年分: 合計所得金額に応じた金額)
  function yeBasicDeduction(totalIncome) {
    const t = totalIncome;
    if (t <= 1320000) { return 950000; }
    if (t <= 3360000) { return 880000; }
    if (t <= 4890000) { return 680000; }
    if (t <= 6550000) { return 630000; }
    if (t <= 23500000) { return 580000; }
    if (t <= 24000000) { return 480000; }
    if (t <= 24500000) { return 320000; }
    if (t <= 25000000) { return 160000; }
    return 0;
  }
  // 配偶者控除・配偶者特別控除。本人の合計所得が900万円以下は満額、900〜950万円・950〜1000万円は減額、1000万円超は対象外。
  const YE_SPOUSE_SPECIAL_LIMITS = [950000, 1000000, 1050000, 1100000, 1150000, 1200000, 1250000, 1300000, 1330000];
  const YE_SPOUSE_SPECIAL_FULL = [380000, 360000, 310000, 260000, 210000, 160000, 110000, 60000, 30000];
  const YE_SPOUSE_SPECIAL_MID = [260000, 240000, 210000, 180000, 140000, 110000, 80000, 40000, 20000];
  const YE_SPOUSE_SPECIAL_LOW = [130000, 120000, 110000, 90000, 70000, 60000, 40000, 20000, 10000];
  function yeSpouseDeduction(selfIncome, spouseIncome, spouseElderly) {
    let band = "full";
    if (selfIncome > 10000000) { return 0; }
    if (selfIncome > 9500000) { band = "low"; }
    else if (selfIncome > 9000000) { band = "mid"; }
    if (spouseIncome <= 580000) {
      const base = spouseElderly ? [480000, 320000, 160000] : [380000, 260000, 130000];
      return band === "full" ? base[0] : (band === "mid" ? base[1] : base[2]);
    }
    const table = band === "full" ? YE_SPOUSE_SPECIAL_FULL : (band === "mid" ? YE_SPOUSE_SPECIAL_MID : YE_SPOUSE_SPECIAL_LOW);
    for (let i = 0; i < YE_SPOUSE_SPECIAL_LIMITS.length; i++) {
      if (spouseIncome <= YE_SPOUSE_SPECIAL_LIMITS[i]) { return table[i]; }
    }
    return 0;
  }
  // 生命保険料控除(新制度は上限4万円、旧制度は上限5万円。新旧の両方があるときは新制度の上限4万円)。合計の上限は12万円。
  function yeLifeNew(x) {
    if (x <= 20000) { return x; }
    if (x <= 40000) { return Math.floor(x / 2) + 10000; }
    if (x <= 80000) { return Math.floor(x / 4) + 20000; }
    return 40000;
  }
  function yeLifeOld(x) {
    if (x <= 25000) { return x; }
    if (x <= 50000) { return Math.floor(x / 2) + 12500; }
    if (x <= 100000) { return Math.floor(x / 4) + 25000; }
    return 50000;
  }
  function yeLifeKind(newAmount, oldAmount) {
    const n = yeLifeNew(newAmount);
    const o = yeLifeOld(oldAmount);
    if (newAmount > 0) {
      if (oldAmount > 0) { return Math.min(n + o, 40000); }
      return n;
    }
    return o;
  }
  function yeQuakeDeduction(quake, quakeOld) {
    const q = Math.min(quake, 50000);
    let o = 15000;
    if (quakeOld <= 10000) { o = quakeOld; }
    else if (quakeOld <= 20000) { o = Math.floor(quakeOld / 2) + 5000; }
    return Math.min(q + o, 50000);
  }
  // 所得税の速算表(課税給与所得金額 → 税額)
  function yeIncomeTax(taxable) {
    const t = Math.max(0, taxable);
    if (t <= 1950000) { return Math.floor(t * 0.05); }
    if (t <= 3300000) { return Math.floor(t * 0.1 - 97500); }
    if (t <= 6950000) { return Math.floor(t * 0.2 - 427500); }
    if (t <= 9000000) { return Math.floor(t * 0.23 - 636000); }
    if (t <= 18000000) { return Math.floor(t * 0.33 - 1536000); }
    if (t <= 40000000) { return Math.floor(t * 0.4 - 2796000); }
    return Math.floor(t * 0.45 - 4796000);
  }
  // f: 入力フォーム(文字列の値)、sums: 保存済みの給与明細書から集計した値({wages, social, withheld})。
  function calcYearEnd(f, sums) {
    const pick = (key, auto) => (f[key] === "" || f[key] === undefined) ? auto : yeNum(f[key]);
    const wages = pick("wages", sums.wages) + yeNum(f.prevWages);
    const social = pick("social", sums.social) + yeNum(f.prevSocial);
    const withheld = pick("withheld", sums.withheld) + yeNum(f.prevWithheld);
    const salaryIncome = (f.salaryIncomeOverride === "" || f.salaryIncomeOverride === undefined) ? yeSalaryIncome(wages) : yeNum(f.salaryIncomeOverride);
    const basic = (f.basicOverride === "" || f.basicOverride === undefined) ? yeBasicDeduction(salaryIncome) : yeNum(f.basicOverride);

    const extraSocial = yeNum(f.extraSocial);
    const socialTotal = social + extraSocial;
    const lifeGeneral = yeLifeKind(yeNum(f.lifeNewGeneral), yeNum(f.lifeOldGeneral));
    const lifeCare = yeLifeNew(yeNum(f.lifeNewCare));
    const lifePension = yeLifeKind(yeNum(f.lifeNewPension), yeNum(f.lifeOldPension));
    const life = Math.min(lifeGeneral + lifeCare + lifePension, 120000);
    const quake = yeQuakeDeduction(yeNum(f.quake), yeNum(f.quakeOld));
    const smallBiz = yeNum(f.smallBiz);

    let spouse = 0;
    if (f.spouse === "yes") {
      spouse = (f.spouseOverride === "" || f.spouseOverride === undefined)
        ? yeSpouseDeduction(salaryIncome, yeNum(f.spouseIncome), !!f.spouseElderly)
        : yeNum(f.spouseOverride);
    }
    const dependents = yeNum(f.depGeneral) * 380000 + yeNum(f.depSpecial) * 630000 + yeNum(f.depElderly) * 480000
      + yeNum(f.depElderlyLive) * 580000 + yeNum(f.depSpecialRelative);
    const disabilityOthers = yeNum(f.depDisabled) * 270000 + yeNum(f.depSpecialDisabled) * 400000 + yeNum(f.depLiveSpecialDisabled) * 750000;
    const selfDisability = f.selfDisability === "special" ? 400000 : (f.selfDisability === "general" ? 270000 : 0);
    const single = f.single === "singleParent" ? 350000 : (f.single === "widow" ? 270000 : 0);
    const student = f.student ? 270000 : 0;
    const personal = spouse + dependents + disabilityOthers + selfDisability + single + student;

    const deductionsTotal = socialTotal + life + quake + smallBiz + basic + personal;
    const taxableIncome = Math.floor(Math.max(0, salaryIncome - deductionsTotal) / 1000) * 1000;
    const taxBefore = yeIncomeTax(taxableIncome);
    const housing = yeNum(f.housingLoan);
    const taxAfter = Math.max(0, taxBefore - housing);
    const annualTax = Math.floor(Math.floor(taxAfter * 1.021) / 100) * 100;
    const diff = annualTax - withheld; // 正=不足(徴収)、負=超過(還付)
    return {
      wages, salaryIncome, social, extraSocial, socialTotal, life, lifeGeneral, lifeCare, lifePension, quake, smallBiz, basic,
      spouse, dependents, disabilityOthers, selfDisability, single, student, personal, deductionsTotal,
      taxableIncome, taxBefore, housing, taxAfter, annualTax, withheld, diff,
    };
  }

  // ============================================================
  // 年末調整パネル(従業員と年を選び、保存済みの給与明細書の合計と、控除の申告内容から年税額を計算する)
  // ============================================================
  function yeDefaultForm() {
    return {
      wages: "", social: "", withheld: "", prevWages: "", prevSocial: "", prevWithheld: "",
      salaryIncomeOverride: "", basicOverride: "", extraSocial: "",
      lifeNewGeneral: "", lifeNewCare: "", lifeNewPension: "", lifeOldGeneral: "", lifeOldPension: "",
      quake: "", quakeOld: "", smallBiz: "",
      spouse: "none", spouseIncome: "", spouseElderly: false, spouseOverride: "",
      depGeneral: "", depSpecial: "", depElderly: "", depElderlyLive: "", depUnder16: "", depSpecialRelative: "",
      depDisabled: "", depSpecialDisabled: "", depLiveSpecialDisabled: "",
      selfDisability: "none", single: "none", student: false, housingLoan: "", applyMonth: "12",
    };
  }
  function yeNewState() {
    return {
      year: currentCalendarYear(), staffId: "", loading: false, sums: null, form: yeDefaultForm(), result: null,
      msg: "", msgOk: false, saving: false, savedAt: "", list: [], declList: [], decl: null,
    };
  }
  function yeRecalc() {
    const ye = state.yearEnd;
    ye.result = ye.sums ? calcYearEnd(ye.form, ye.sums) : null;
  }
  // 過不足額の表示(正=不足で徴収、負=超過で還付)
  function yeDiffText(diff) {
    const d = Math.round(Number(diff) || 0);
    if (d === 0) { return "過不足なし(¥0)"; }
    return d > 0 ? `不足 ${yen(d)}(徴収)` : `超過 ${yen(-d)}(還付)`;
  }
  function yeSignedYen(n) {
    const v = Math.round(Number(n) || 0);
    return Math.sign(v) === -1 ? "-" + yen(Math.abs(v)) : yen(v);
  }
  async function yeLoadList() {
    const ye = state.yearEnd;
    const year = ye.year;
    try {
      const res = await apiFetch(`${API_BASE}/year-end?year=${year}`);
      const rows = res.ok ? await res.json() : [];
      if (ye.year === year) { ye.list = Array.isArray(rows) ? rows : []; }
    } catch (e) { ye.list = []; }
    render();
  }
  async function yeLoadDeclList() {
    const ye = state.yearEnd;
    const year = ye.year;
    try {
      const res = await apiFetch(`${API_BASE}/year-end-decl?year=${year}`);
      const rows = res.ok ? await res.json() : [];
      if (ye.year === year) { ye.declList = Array.isArray(rows) ? rows : []; }
    } catch (e) { ye.declList = []; }
    render();
  }
  // 従業員が「有給照会」ページから提出した申告内容を、年末調整の入力欄に取り込む(給与・社会保険料・源泉税の欄は変えない)。
  function yeImportDecl() {
    const ye = state.yearEnd;
    const rec = ye.decl;
    if (!rec) { return; }
    const d = rec.data || {};
    Object.keys(d).forEach(k => {
      if (k === "memo") { return; }
      if (Object.prototype.hasOwnProperty.call(ye.form, k)) { ye.form[k] = d[k]; }
    });
    yeRecalc();
    ye.msg = "従業員の申告内容を取り込みました。内容を確認して、必要なら直してから「保存する」を押してください。";
    ye.msgOk = true;
    render();
  }

  async function yeLoad() {
    const ye = state.yearEnd;
    const staffId = ye.staffId;
    const year = ye.year;
    if (!staffId) { ye.sums = null; ye.result = null; ye.form = yeDefaultForm(); ye.decl = null; render(); return; }
    ye.loading = true; ye.msg = ""; render();
    const sums = { wages: 0, social: 0, withheld: 0, months: 0 };
    try {
      const res = await apiFetch(`${API_BASE}/payslips?staffId=${staffId}&year=${year}`);
      const rows = res.ok ? await res.json() : [];
      rows.forEach(r => {
        const d = r.data || {};
        const t = derivePayslipTotals(Object.assign({}, d, { yearEndAdjustment: 0 }));
        sums.wages += Number(t.taxableThisMonth) || 0;
        sums.social += (Number(d.employmentInsurance) || 0) + (Number(d.healthInsurance) || 0) + (Number(d.careInsurance) || 0)
          + (Number(d.pensionInsurance) || 0) + (Number(d.childSupport) || 0);
        sums.withheld += Number(d.incomeTax) || 0;
        sums.months++;
      });
    } catch (e) { /* 取得できなければ0のまま(手入力で補える) */ }
    let form = yeDefaultForm();
    let savedAt = "";
    try {
      const res = await apiFetch(`${API_BASE}/year-end/${staffId}/${year}`);
      const rec = res.ok ? await res.json() : false;
      if (rec) {
        if (rec.data) { form = Object.assign(form, rec.data.form || {}); }
        savedAt = rec.updatedAt || "";
      }
    } catch (e) { /* 保存済みが無ければ初期値 */ }
    let decl = null;
    try {
      const res = await apiFetch(`${API_BASE}/year-end-decl/${staffId}/${year}`);
      const rec = res.ok ? await res.json() : false;
      if (rec) { decl = rec; }
    } catch (e) { /* 申告が無ければnull */ }
    if (ye.staffId !== staffId) { return; }
    if (ye.year !== year) { return; }
    ye.sums = sums; ye.form = form; ye.savedAt = savedAt; ye.decl = decl; ye.loading = false;
    yeRecalc(); render();
  }
  function yeBody() {
    const ye = state.yearEnd;
    const staff = STAFF.find(s => s.id === String(ye.staffId));
    return {
      staffName: staff ? staff.name : "",
      applyMonth: Number(ye.form.applyMonth) || 12,
      adjustment: ye.result ? ye.result.diff : 0,
      data: { form: ye.form, sums: ye.sums, result: ye.result },
    };
  }

  function yeField(key, label, placeholder) {
    const f = state.yearEnd.form;
    return `
      <div class="field">
        <label>${label}</label>
        <input type="text" inputmode="numeric" placeholder="${escapeHtml(placeholder || "")}" value="${escapeHtml(f[key])}" oninput="__kyuyo.setYeField('${key}', this.value)">
      </div>`;
  }
  function yeSelect(key, label, options) {
    const f = state.yearEnd.form;
    return `
      <div class="field">
        <label>${label}</label>
        <select onchange="__kyuyo.setYeField('${key}', this.value)">
          ${options.map(o => `<option value="${o[0]}" ${f[key] === o[0] ? "selected" : ""}>${escapeHtml(o[1])}</option>`).join("")}
        </select>
      </div>`;
  }
  function yeCheck(key, label) {
    const f = state.yearEnd.form;
    return `
      <div class="field check">
        <label style="display:flex;align-items:center;gap:6px;font-weight:normal;"><input type="checkbox" ${f[key] ? "checked" : ""} onchange="__kyuyo.setYeField('${key}', this.checked)">${label}</label>
      </div>`;
  }
  function yeRow(label, value, cls) {
    return `<div class="result-row ${cls || ""}"><span>${label}</span><span>${value}</span></div>`;
  }

  function renderYearEndPanel() {
    const ye = state.yearEnd;
    const isOpen = state.panelOpen.yearEnd;
    const r = ye.result;
    const sums = ye.sums;
    const staff = STAFF.find(s => s.id === String(ye.staffId));
    const showForm = ye.staffId === "" ? false : !!sums;
    const autoHint = v => "自動: " + (v === undefined ? "0" : Number(v).toLocaleString("ja-JP"));
    const listHtml = ye.list.length === 0
      ? `<p class="empty-note" style="padding:6px 0;">${ye.year}年分で保存した年末調整はまだありません。</p>`
      : `<div class="result-box" style="margin-bottom:12px;">
          <div class="table-card-title">${ye.year}年分の年末調整(保存済み)</div>
          ${ye.list.map(x => yeRow(`${escapeHtml(x.staffName)}(${x.applyMonth}月の明細に反映)`, yeDiffText(x.adjustment))).join("")}
        </div>`;
    const declListHtml = ye.declList.length === 0 ? "" : `
        <div class="result-box" style="margin-bottom:12px;">
          <div class="table-card-title">${ye.year}年分の申告を提出した従業員(従業員の「給与・有給休暇照会」ページから提出されたもの)</div>
          ${ye.declList.map(x => yeRow(escapeHtml(x.staffName), `提出 ${escapeHtml(x.submittedAt)}`)).join("")}
        </div>`;
    const declBoxHtml = !ye.decl ? "" : `
        <div class="result-box" style="margin:10px 0;border-color:#9fd3c7;background:#f2fbf8;">
          <div class="table-card-title">この従業員から申告が提出されています(${escapeHtml(ye.decl.submittedAt)})</div>
          ${ye.decl.data ? (ye.decl.data.memo ? `<div class="result-row"><span>連絡事項: ${escapeHtml(ye.decl.data.memo)}</span><span></span></div>` : "") : ""}
          <div style="margin-top:6px;"><button type="button" class="btn-secondary" onclick="__kyuyo.importYearEndDecl()">申告内容を入力欄に取り込む</button></div>
        </div>`;
    const resultHtml = !r ? "" : `
      <div class="result-box" style="margin-top:14px;">
        <div class="table-card-title">${ye.year}年分 年末調整の計算結果${staff ? `(${escapeHtml(staff.name)})` : ""}</div>
        ${yeRow("給与等の金額(課税支給・前職分を含む)", yen(r.wages))}
        ${yeRow("給与所得控除後の給与等の金額", yen(r.salaryIncome))}
        ${yeRow("社会保険料等の控除", yen(r.socialTotal))}
        ${yeRow("生命保険料控除", yen(r.life))}
        ${yeRow("地震保険料控除", yen(r.quake))}

        ${yeRow("配偶者(特別)控除", yen(r.spouse))}
        ${yeRow("扶養控除等・障害者控除など", yen(r.dependents + r.disabilityOthers + r.selfDisability + r.single + r.student))}
        ${yeRow("所得控除の合計", yen(r.deductionsTotal), "total")}
        ${yeRow("課税給与所得金額(千円未満切捨て)", yen(r.taxableIncome))}
        ${yeRow("算出所得税額", yen(r.taxBefore))}
        ${yeRow("住宅借入金等特別控除", yen(r.housing))}
        ${yeRow("年調年税額(復興特別所得税を含む)", yen(r.annualTax), "total")}
        ${yeRow("すでに徴収した所得税額", yen(r.withheld))}
        ${yeRow("過不足額", `<b style="color:${r.diff > 0 ? "var(--orange)" : "var(--green)"};">${yeDiffText(r.diff)}</b>`, "total")}
      </div>
      <div class="form-row" style="margin-top:12px;">
        <div class="field" style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;">
          <button type="button" class="btn-primary" ${ye.saving ? "disabled" : ""} onclick="__kyuyo.saveYearEnd()">${ye.saving ? "保存中…" : "保存する"}</button>
          <button type="button" class="btn-secondary" onclick="__kyuyo.applyYearEndToPayslip()">${escapeHtml(ye.form.applyMonth)}月の保存済み給与明細に反映</button>

          <button type="button" class="btn-secondary" onclick="__kyuyo.printYearEnd('slip')">源泉徴収票を印刷</button>
          ${ye.savedAt ? `<button type="button" class="btn-link btn-danger" onclick="__kyuyo.deleteYearEnd()">保存した内容を削除</button>` : ""}
        </div>
      </div>
      ${ye.savedAt ? `<p class="table-card-sub">最終保存: ${escapeHtml(ye.savedAt)}</p>` : ""}`;
    return `
      <div class="panel">
        <div class="panel-title collapsible" onclick="__kyuyo.togglePanel('yearEnd')">
          <span>年末調整</span>
          <span class="chevron">${isOpen ? "▲ 閉じる" : "▼ 開く"}</span>
        </div>
        ${isOpen ? `
        <p class="table-card-sub" style="margin-bottom:10px;">従業員と年を選ぶと、その年の保存済みの給与明細書から、給与・社会保険料・源泉徴収済みの所得税を集計します。扶養や保険料などの申告内容を入力すると、年税額と過不足額(還付・徴収)を計算し、12月の給与明細書に反映できます。</p>
        <div class="hint-box" style="margin-bottom:12px;">${escapeHtml(YE_TAX_NOTE)}</div>
        ${listHtml}
        ${declListHtml}
        <div class="form-row">
          <div class="field">
            <label>対象の年(給与を支払った年)</label>
            <input type="text" inputmode="numeric" value="${escapeHtml(ye.year)}" onchange="__kyuyo.setYeYear(this.value)">
          </div>
          <div class="field">
            <label>従業員</label>
            <select onchange="__kyuyo.setYeStaff(this.value)">
              <option value="">-- 選択してください --</option>
              ${staffOptionsHtml(ye.staffId)}
            </select>

        </div>
        ${ye.loading ? `<p class="empty-note">読み込み中…</p>` : ""}
        ${declBoxHtml}
        ${showForm ? `
          <p class="table-card-sub">保存済みの給与明細書: ${sums.months}か月分 ／ 課税給与 ${yen(sums.wages)} ／ 社会保険料 ${yen(sums.social)} ／ 源泉徴収済み所得税 ${yen(sums.withheld)}${sums.months < 12 ? "(12か月分そろっていないときは、下の欄で補ってください)" : ""}</p>

            ${row(cellText("(源泉)控除対象配偶者の有無等", spouseMark, 1) + cell("配偶者(特別)控除の額(円)", Number(r.spouse).toLocaleString("ja-JP"), 2) + cell("特定扶養親族(人)", n("depSpecial"), 1) + cell("老人扶養親族(人)", elderly, 1) + cell("(内 同居老親等)(人)", n("depElderlyLive"), 1) + cell("その他(人)", n("depGeneral"), 1) + cell("16歳未満(人)", n("depUnder16"), 1))}

            ${row(cellText("摘要", escapeHtml(remarks), 1))}
            ${row(cellText("支払者 住所(居所)又は所在地", escapeHtml(info.address || ""), 3) + cellText("氏名又は名称", escapeHtml(info.name || ""), 2) + cellText("電話", escapeHtml(info.phone || ""), 1))}

  // 再描画のたびに#kyuyo-app全体のinnerHTMLを作り直しているため、何もしないとinput/selectへの
  // フォーカスとカーソル位置が毎回失われ、数字や文字を1文字入力するごとにフォーカスが外れて
  // 次の文字が入力できなくなる。oninput/onchange属性の文字列(各項目でキー名が異なるため実質的に
  // 一意)を手がかりに、再描画後に同じ項目へフォーカスとカーソル位置を復元する。
  function captureFocus() {
    const app = document.getElementById("kyuyo-app");
    const active = document.activeElement;
    if (!active) { return null; }
    if (!app.contains(active)) { return null; }
    const key = active.getAttribute("oninput") || active.getAttribute("onchange");
    if (!key) { return null; }
    return {
      key,
      selectionStart: (typeof active.selectionStart === "number") ? active.selectionStart : null,
      selectionEnd: (typeof active.selectionEnd === "number") ? active.selectionEnd : null,
    };
  }
  function restoreFocus(focusInfo) {
    if (!focusInfo) { return; }
    const app = document.getElementById("kyuyo-app");
    const candidates = app.querySelectorAll("input, select, textarea");
    for (const el of candidates) {
      const key = el.getAttribute("oninput") || el.getAttribute("onchange");
      if (key !== focusInfo.key) { continue; }
      el.focus();
      if (focusInfo.selectionStart === null) { break; }
      if (typeof el.setSelectionRange !== "function") { break; }
      try {
        el.setSelectionRange(focusInfo.selectionStart, focusInfo.selectionEnd);
      } catch (e) { /* type=number等、カーソル位置指定に対応していない場合は無視 */ }
      break;
    }
  }

  // 日本語入力(IME変換)の途中でrender()がDOMを丸ごと作り直すと、変換中の要素が
  // 差し替えられてIMEの変換状態が壊れ、日本語が入力できなくなってしまう。
  // 変換中(compositionstart〜compositionend)はrender()を止め、変換確定後に1回だけ描画し直す。
  let imeComposing = false;
  document.getElementById("kyuyo-app").addEventListener("compositionstart", () => { imeComposing = true; });
  document.getElementById("kyuyo-app").addEventListener("compositionend", () => { imeComposing = false; render(); });

  function render() {
    if (imeComposing) { return; }
    const focusInfo = captureFocus();
    document.getElementById("kyuyo-app").innerHTML = `
      <div style="text-align:center;padding:10px 16px 0;"><a href="${getSiteBasePath()}/トップ/" style="color:#8a8577;font-size:13px;text-decoration:underline;">← トップに戻る</a></div>

        <p>年度ごとの社会保険・厚生年金保険料額表、源泉所得税額表をもとに、控除額を計算します(国税庁・協会けんぽが配布しているExcelファイルをそのまま読み込めます)</p>
      </div>
      ${renderUploadPanel()}
      ${renderTaxUploadPanel()}
      ${renderBonusUploadPanel()}
      ${renderDailyUploadPanel()}
      ${renderDailyCalcPanel()}
      ${renderLeavePanel()}
      ${renderAttendancePanel()}
      ${renderYearEndPanel()}
      ${renderPayslipPanel()}
      <div class="back-link">
        <a href="${getSiteBasePath()}/トップ/">← トップに戻る</a>
      </div>
    `;
    document.getElementById("kyuyo-print-root").innerHTML = state.yearEndPrint === "slip" ? renderWithholdingSlipPrintView() : (state.yearEndPrint ? renderYearEndPrintView() : (state.bulkPayslips ? renderBulkPayslipPrintView() : renderPayslipPrintView()));
    restoreFocus(focusInfo);
  }

  // 「従業員登録」で追加した新しい部署を、標準の4部署の後ろに加え、その色(CSS)も用意する。
  async function loadDepartments() {
    let list = [];
    try {
      const res = await fetch(`${API_BASE}/departments`);
      const j = res.ok ? await res.json() : [];
      if (Array.isArray(j)) { list = j; }
    } catch (e) { list = []; }
    list.forEach(d => { if (DEPTS.indexOf(d.name) === -1) { DEPTS.push(d.name); } });
    STAFF.forEach(s => { if (s.dept) { if (DEPTS.indexOf(s.dept) === -1) { DEPTS.push(s.dept); } } });
    list.forEach(d => { DEPT_COLOR[d.name] = d.fg; });
  }

  async function init() {
    await Promise.all([loadStaffList(), loadTables(), loadTaxTables(), loadBonusTaxTables(), loadDailyTaxTables(), loadCompanyInfoForPayroll()]);
    await loadDepartments();
    autoSelectPayslipTables();
    render();
    loadFiveDayWarnings();
  }
  window.addEventListener("mushAdminAuthed", () => { init(); });
  init();
</script>

<script>
  // ============================================================
  // ログアウトボタン(管理者・従業員どちらでも)。ログイン中だけ、画面の右上に出す。
  // 押すと、このブラウザに保存してあるログイン情報(管理者・従業員)を消して、ページを開き直す。
  // ※この範囲では論理積(アンパサンド2つ)や山かっこの比較を使わない(WordPressの表示処理が記号を壊すことがあるため)。
  // ============================================================
  (function () {
    if (window.__mushLogoutInstalled) { return; }
    window.__mushLogoutInstalled = true;
    var KEYS = ['mush_admin_auth', 'mush_nippo_auth'];
    function isValid(key) {
      try {
        var a = JSON.parse(localStorage.getItem(key) || 'null');
        if (!a) { return false; }
        if (!a.token) { return false; }
        return a.expiresAt > Date.now();
      } catch (e) { return false; }
    }
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'mush-logout-btn';
    btn.style.cssText = 'position:fixed;top:44px;right:12px;z-index:99998;display:none;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:4px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);font-family:inherit;';
    btn.addEventListener('click', function () {
      if (!confirm('ログアウトしますか?')) { return; }
      KEYS.forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
      location.reload();
    });
    function update() {
      var admin = isValid(KEYS[0]);
      var emp = isValid(KEYS[1]);
      if (admin || emp) {
        btn.textContent = admin ? '管理者ログアウト' : 'ログアウト';
        btn.style.display = 'block';
      } else {
        btn.style.display = 'none';
      }
    }
    function attach() {
      if (!document.body) { return; }
      document.body.appendChild(btn);
      update();
    }
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', attach); } else { attach(); }
    ['mushAdminAuthed', 'mushLoginAuthed', 'mushNippoAuthed', 'mushKeiriAuthed'].forEach(function (ev) {
      window.addEventListener(ev, function () { setTimeout(update, 300); });
    });
    window.addEventListener('storage', update);
    setInterval(update, 3000); // ログイン・ログアウトの状態を見るだけ(画面の読み込みはしない)
  })();
</script>
