<style>
.cad-floor-plan-widget{max-width:1200px;margin:20px auto;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.cad-floor-plan-widget *{box-sizing:border-box}
.cfp-container{background:#18181b;border:1px solid #27272a;border-radius:8px;padding:22px}
.cfp-header{text-align:center;margin-bottom:20px;border-bottom:2px solid #27272a;padding-bottom:14px}
.cfp-header h2{color:#fff;margin:0 0 8px;font-size:22px;border:0;background:none}
.cfp-header p{color:#d4d4d8;margin:0;font-size:14px}
.cfp-input-area{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:16px}
.cfp-drop{background:#09090b;border:2px dashed #3b82f6;border-radius:8px;padding:20px;text-align:center;cursor:pointer;transition:background .2s,border-color .2s}
.cfp-drop:hover,.cfp-drop.is-over{border-color:#60a5fa;background:#0f172a}
.cad-floor-plan-widget .cfp-drop input[type=file]{display:none!important}
.cfp-drop-title{display:block;font-weight:700;color:#60a5fa;margin-bottom:8px;font-size:15px}
.cfp-drop-note{font-size:12px;color:#a1a1aa;line-height:1.7}
.cfp-info-panel{background:#09090b;border:1px solid #27272a;border-radius:8px;padding:12px 15px;font-size:13px}
.cfp-info-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #27272a}
.cfp-info-row:last-child{border-bottom:0}
.cfp-label{color:#a1a1aa;font-weight:600}
.cfp-value{color:#fff;font-weight:700;text-align:right;word-break:break-all}
.cfp-options{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:12px;font-size:13px;color:#d4d4d8}
.cfp-options label{display:flex;flex-direction:column;gap:4px}
.cfp-options input[type=number]{width:110px;padding:6px 8px;background:#09090b;color:#fff;border:1px solid #3f3f46;border-radius:6px}
.cfp-options input[type=file]{max-width:240px;color:#d4d4d8}
.cfp-status{padding:10px 14px;border-radius:6px;margin:0 0 12px;font-size:13px;display:none}
.cfp-status-success{display:block;background:#064e3b;border:1px solid #059669;color:#86efac}
.cfp-status-error{display:block;background:#7f1d1d;border:1px solid #991b1b;color:#fca5a5}
.cfp-status-loading{display:block;background:#1f2937;border:1px solid #4b5563;color:#e5e7eb}
.cfp-canvas{width:100%;background:#09090b;border:1px solid #27272a;border-radius:8px;overflow:hidden;cursor:grab}
.cfp-canvas:active{cursor:grabbing}
.cfp-hint{font-size:12px;color:#a1a1aa;margin:6px 0 0}
.cfp-controls{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.cfp-btn{background:#27272a;color:#fff;border:1px solid #3f3f46;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600}
.cfp-btn:hover{background:#3f3f46;border-color:#60a5fa;color:#60a5fa}
@media(max-width:768px){.cfp-input-area{grid-template-columns:1fr}.cfp-btn{flex:1}}
.cfp-check{flex-direction:row!important;align-items:center;gap:8px!important;cursor:pointer}
.cfp-options select{padding:6px 8px;background:#09090b;color:#fff;border:1px solid #3f3f46;border-radius:6px}
.cfp-rooms{background:#09090b;border:1px solid #27272a;border-radius:8px;padding:14px;margin:0 0 12px}
.cfp-rooms[hidden]{display:none}
.cfp-rooms-title{font-size:13px;font-weight:700;color:#fbbf24;margin-bottom:10px}
.cfp-rooms-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.cfp-plan{width:100%;height:240px;background:#18181b;border:1px solid #27272a;border-radius:6px}
.cfp-plan-room{cursor:pointer;outline:none}
.cfp-plan-room polygon{fill:#27272a;stroke:#71717a;stroke-width:1.5;vector-effect:non-scaling-stroke}
.cfp-plan-room text{fill:#d4d4d8;font-weight:700;pointer-events:none}
.cfp-plan-room:hover polygon,.cfp-plan-room:focus polygon{fill:#3f3f46;stroke:#60a5fa}
.cfp-plan-room.is-selected polygon{fill:#1d4ed8;stroke:#93c5fd;stroke-width:2.5}
.cfp-plan-room.is-selected text{fill:#fff}
.cfp-room-list{display:flex;flex-direction:column;gap:6px;max-height:240px;overflow:auto}
.cfp-room-btn{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;background:#18181b;color:#e4e4e7;border:1px solid #3f3f46;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:13px}
.cfp-room-btn:hover{border-color:#60a5fa}
.cfp-room-btn.is-selected{background:#1e3a8a;border-color:#93c5fd;color:#fff}
.cfp-room-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#3f3f46;font-weight:700;font-size:12px}
.cfp-room-btn.is-selected .cfp-room-num{background:#2563eb}
.cfp-room-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfp-room-meta{font-size:12px;color:#a1a1aa;white-space:nowrap}
.cfp-room-btn.is-selected .cfp-room-meta{color:#bfdbfe}
@media(max-width:768px){.cfp-rooms-body{grid-template-columns:1fr}}

<div class="cad-floor-plan-widget" data-height="600" data-sample="default">
  <div class="cfp-container">
    <div class="cfp-header">
      <h2>CADお部屋シミュレーション</h2>
      <p>DXF / PDF（ベクター）/ JSON の間取りを3D表示し、床・壁の面積を計算します</p>
    </div>
    <div class="cfp-input-area">
      <div class="cfp-drop" data-cfp="drop">
        <span class="cfp-drop-title">ファイルをドロップ、またはクリックして選択</span>
        <input type="file" data-cfp="file" accept=".dxf,.pdf,.json">
        <div class="cfp-drop-note">対応形式: DXF / PDF（ベクター）/ JSON<br>DWGはDXFに書き出してください</div>
      </div>
      <div class="cfp-info-panel">
        <div class="cfp-info-row"><span class="cfp-label">ファイル</span><span class="cfp-value" data-cfp="filename">未選択</span></div>
        <div class="cfp-info-row"><span class="cfp-label">選択中の部屋</span><span class="cfp-value" data-cfp="room-name">-</span></div>
        <div class="cfp-info-row"><span class="cfp-label">サイズ（幅×奥行）</span><span class="cfp-value" data-cfp="room-size">-</span></div>
        <div class="cfp-info-row"><span class="cfp-label">図面の単位</span><span class="cfp-value" data-cfp="unit-info">-</span></div>
        <div class="cfp-info-row"><span class="cfp-label">床面積</span><span class="cfp-value" data-cfp="floor-area">-</span></div>
        <div class="cfp-info-row"><span class="cfp-label">壁面積</span><span class="cfp-value" data-cfp="wall-area">-</span></div>
        <div class="cfp-info-row"><span class="cfp-label">部屋数</span><span class="cfp-value" data-cfp="room-count">0</span></div>
      </div>
    </div>
    <div class="cfp-options">
      <label>PDFの縮尺（1:N の N）<input type="number" data-cfp="scale" min="1" step="1" value="1"></label>
      <label>DXFの単位<select data-cfp="unit"><option value="auto">自動判定</option><option value="mm">mm</option><option value="cm">cm</option><option value="m">m</option></select></label>
      <label class="cfp-check"><input type="checkbox" data-cfp="apply-size" checked> 図面のサイズを見積もり・パースに反映する</label>
      <label>床デザイン画像<input type="file" data-cfp="floor-tex" accept="image/*"></label>
      <label>壁紙デザイン画像<input type="file" data-cfp="wall-tex" accept="image/*"></label>
    </div>
    <div class="cfp-status" data-cfp="status"></div>
    <div class="cfp-rooms" data-cfp="rooms" hidden>
      <div class="cfp-rooms-title">部屋を選択（平面図をクリック、または一覧から選ぶと、その部屋を3Dで表示します）</div>
      <div class="cfp-rooms-body">
        <svg class="cfp-plan" data-cfp="plan" role="group" aria-label="間取りの平面図"></svg>
        <div class="cfp-room-list" data-cfp="room-list"></div>
      </div>
    </div>
    <div class="cfp-canvas" data-cfp="canvas"></div>
    <p class="cfp-hint">ドラッグで回転、ホイールで拡大縮小</p>
    <p class="cfp-hint" data-cfp="design-note"></p>
    <p class="cfp-hint" data-cfp="size-note"></p>
    <div class="cfp-controls">
      <button type="button" class="cfp-btn" data-cfp="sample-btn">サンプル</button>
      <button type="button" class="cfp-btn" data-cfp="reset-btn">視点をリセット</button>
      <button type="button" class="cfp-btn" data-cfp="save-btn">解析結果をJSON保存</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/**
 * CADParser: DXF / vector PDF / JSON floor plan -> normalized room data.
 * All coordinates in the output are millimetres, CAD convention (Y up).
 */
(function (root) {
  'use strict';
  const DEFAULT_WALL_HEIGHT = 2400;
  const MIN_ROOM_AREA_MM2 = 0.5 * 1e6; // loops smaller than 0.5 m2 are treated as noise
  const SNAP_MM = 2;
  const PDFJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
  const PDFJS_WORKER_URL = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  // DXF $INSUNITS -> mm
  const INSUNITS_TO_MM = { 1: 25.4, 2: 304.8, 4: 1, 5: 10, 6: 1000 };
  class CADParser {
    static async parseFloorPlan(input, options = {}) {
      if (typeof input === 'string') return this.parseJSON(input);
      const ext = (input.name.split('.').pop() || '').toLowerCase();
      switch (ext) {
        case 'dxf':
          return this.parseDXF(this._decodeDXF(await input.arrayBuffer()), options);
        case 'pdf':
          return this.parsePDF(input, options);
        case 'json':
          return this.parseJSON(await input.text());
        case 'dwg':
          throw new Error('DWGは直接読み込めません。CADソフトでDXF形式に書き出してからアップロードしてください。');
        default:
          throw new Error('未対応の形式です: .' + ext + '（DXF / PDF / JSON に対応）');
      }
    }
    // ---------------------------------------------------------------- DXF
    // DXF before R2007 stores text in the drawing's code page (Japanese drawings: Shift_JIS)
    static _decodeDXF(buffer) {
      const head = new TextDecoder('latin1').decode(new Uint8Array(buffer, 0, Math.min(buffer.byteLength, 20000)));
      const ver = (head.match(/\$ACADVER\s+1\s+(AC\d+)/) || [])[1];
      let enc = 'utf-8';
      if (!ver || ver < 'AC1021') {
        const cp = (head.match(/\$DWGCODEPAGE\s+3\s+(\S+)/) || [])[1] || '';
        enc = { ANSI_932: 'shift_jis', ANSI_936: 'gbk', ANSI_949: 'euc-kr', ANSI_950: 'big5', ANSI_1252: 'windows-1252' }[cp.toUpperCase()] || (cp ? 'windows-1252' : 'utf-8');
      }
      try { return new TextDecoder(enc).decode(buffer); } catch (e) { return new TextDecoder('utf-8').decode(buffer); }
    }
    static _cleanDxfText(t) {
      return t
        .replace(/\\U\+([0-9A-Fa-f]{4})/g, (m, h) => String.fromCharCode(parseInt(h, 16)))
        .replace(/\\P/g, ' ')
        .replace(/\\[A-Za-z][^;\\]*;/g, '')
        .replace(/[{}]/g, '')
        .replace(/%%[cCdDpP]/g, '')
        .trim();
    }
    static parseDXF(text, options = {}) {
      const lines = text.split(/\r\n|\r|\n/);
      const pairs = [];
      for (let i = 0; i + 1 < lines.length; i += 2) {
        pairs.push([parseInt(lines[i].trim(), 10), lines[i + 1].trim()]);
      }
      // drawing units from the header ($INSUNITS; 0 = unspecified)
      let headerScale = 0;
      for (let i = 0; i < pairs.length; i++) {
        if (pairs[i][0] === 9 && pairs[i][1] === '$INSUNITS' && pairs[i + 1]) {
          headerScale = INSUNITS_TO_MM[parseInt(pairs[i + 1][1], 10)] || 0;
          break;
        }
      }
      // entities section
      let start = -1;
      for (let i = 0; i < pairs.length - 1; i++) {
        if (pairs[i][0] === 0 && pairs[i][1] === 'SECTION' && pairs[i + 1][1] === 'ENTITIES') {
          start = i + 2;
          break;
        }
      }
      if (start < 0) throw new Error('DXFのENTITIESセクションが見つかりません。');
      const closedLoops = [];
      const openPaths = [];
      const segments = [];
      const texts = [];
      let i = start;
      const readEntity = () => {
        const type = pairs[i][1];
        const data = [];
        i++;
        while (i < pairs.length && pairs[i][0] !== 0) data.push(pairs[i++]);
        return { type, data };
      };
      while (i < pairs.length && !(pairs[i][0] === 0 && pairs[i][1] === 'ENDSEC')) {
        if (pairs[i][0] !== 0) { i++; continue; }
        const ent = readEntity();
        if (ent.type === 'LWPOLYLINE') {
          const pts = [];
          let closed = false;
          for (const [code, val] of ent.data) {
            if (code === 70) closed = (parseInt(val, 10) & 1) === 1;
            else if (code === 10) pts.push([parseFloat(val), 0]);
            else if (code === 20 && pts.length) pts[pts.length - 1][1] = parseFloat(val);
          }
          this._addPath(pts, closed, closedLoops, openPaths);
        } else if (ent.type === 'POLYLINE') {
          let closed = false;
          for (const [code, val] of ent.data) if (code === 70) closed = (parseInt(val, 10) & 1) === 1;
          const pts = [];
          while (i < pairs.length && pairs[i][0] === 0 && pairs[i][1] === 'VERTEX') {
            const v = readEntity();
            let x = 0, y = 0;
            for (const [code, val] of v.data) {
              if (code === 10) x = parseFloat(val);
              else if (code === 20) y = parseFloat(val);
            }
            pts.push([x, y]);
          }
          if (i < pairs.length && pairs[i][1] === 'SEQEND') readEntity();
          this._addPath(pts, closed, closedLoops, openPaths);
        } else if (ent.type === 'LINE') {
          let x1 = 0, y1 = 0, x2 = 0, y2 = 0;
          for (const [code, val] of ent.data) {
            if (code === 10) x1 = parseFloat(val);
            else if (code === 20) y1 = parseFloat(val);
            else if (code === 11) x2 = parseFloat(val);
            else if (code === 21) y2 = parseFloat(val);
          }
          segments.push([[x1, y1], [x2, y2]]);
        } else if (ent.type === 'TEXT' || ent.type === 'MTEXT') {
          let x = 0, y = 0, body = '';
          for (const [code, val] of ent.data) {
            if (code === 10) x = parseFloat(val);
            else if (code === 20) y = parseFloat(val);
            else if (code === 3) body += val; // MTEXT continuation chunks
            else if (code === 1) body += val;
          }
          const t = this._cleanDxfText(body);
          if (t) texts.push({ text: t, x, y });
        }
      }
      // unit: manual option > header > guess from the drawing's extent (a room is 1.5 m or larger)
      const allPts = [].concat(...closedLoops, ...openPaths, ...segments);
      let unit = { name: 'mm', source: 'default' };
      const byName = { mm: 1, cm: 10, m: 1000 };
      let unitScale = 1;
      if (options.unit && byName[options.unit]) {
        unitScale = byName[options.unit];
        unit = { name: options.unit, source: 'manual' };
      } else if (headerScale) {
        unitScale = headerScale;
        unit = { name: { 1: 'mm', 10: 'cm', 1000: 'm' }[headerScale] || (headerScale === 25.4 ? 'inch' : headerScale === 304.8 ? 'feet' : 'mm'), source: 'header' };
      } else if (allPts.length) {
        const xs = allPts.map((p) => p[0]), ys = allPts.map((p) => p[1]);
        const extent = Math.max(Math.max(...xs) - Math.min(...xs), Math.max(...ys) - Math.min(...ys));
        if (extent < 100) { unitScale = 1000; unit = { name: 'm', source: 'auto' }; }
        else if (extent < 1500) { unitScale = 10; unit = { name: 'cm', source: 'auto' }; }
        else { unit = { name: 'mm', source: 'auto' }; }
      }
      const scalePts = (pts) => pts.map(([x, y]) => [x * unitScale, y * unitScale]);
      const loops = closedLoops.map(scalePts);
      const edgeList = segments.map((sg) => scalePts(sg));
      for (const path of openPaths) {
        const p = scalePts(path);
        for (let k = 0; k + 1 < p.length; k++) edgeList.push([p[k], p[k + 1]]);
      }
      loops.push(...this._loopsFromSegments(edgeList));
      const labels = texts.map((t) => ({ text: t.text, x: t.x * unitScale, y: t.y * unitScale }));
      return this._buildResult(loops, { source: 'dxf', unitScale, unit }, labels);
    }
    // ---------------------------------------------------------------- PDF
    static async parsePDF(file, options = {}) {
      const pdfjs = await this._ensurePdfJs(options);
      const data = new Uint8Array(await file.arrayBuffer());
      const pdf = await pdfjs.getDocument({ data }).promise;
      const page = await pdf.getPage(options.page || 1);
      const ops = await page.getOperatorList();
      const OPS = pdfjs.OPS;
      // PDF user units are 1/72 inch; options.scale is the drawing scale denominator (1:100 -> 100)
      const mmPerUnit = (25.4 / 72) * (options.scale || 1);
      const loops = [];
      const edges = [];
      let ctm = [1, 0, 0, 1, 0, 0];
      const stack = [];
      const mul = (m, n) => [
        m[0] * n[0] + m[2] * n[1], m[1] * n[0] + m[3] * n[1],
        m[0] * n[2] + m[2] * n[3], m[1] * n[2] + m[3] * n[3],
        m[0] * n[4] + m[2] * n[5] + m[4], m[1] * n[4] + m[3] * n[5] + m[5],
      ];
      const tx = (x, y) => [
        (ctm[0] * x + ctm[2] * y + ctm[4]) * mmPerUnit,
        (ctm[1] * x + ctm[3] * y + ctm[5]) * mmPerUnit,
      ];
      const addSub = (pts, closed) => {
        if (pts.length < 2) return;
        if (closed && pts.length >= 3) loops.push(pts);
        else for (let k = 0; k + 1 < pts.length; k++) edges.push([pts[k], pts[k + 1]]);
      };
      for (let k = 0; k < ops.fnArray.length; k++) {
        const fn = ops.fnArray[k];
        const args = ops.argsArray[k];
        if (fn === OPS.save) stack.push(ctm.slice());
        else if (fn === OPS.restore) ctm = stack.pop() || [1, 0, 0, 1, 0, 0];
        else if (fn === OPS.transform) ctm = mul(ctm, args);
        else if (fn === OPS.constructPath) {
          const pathOps = args[0];
          const c = args[1];
          let ci = 0;
          let cur = [];
          let closed = false;
          const flush = () => { addSub(cur, closed); cur = []; closed = false; };
          for (const op of pathOps) {
            if (op === OPS.moveTo) { flush(); cur.push(tx(c[ci], c[ci + 1])); ci += 2; }
            else if (op === OPS.lineTo) { cur.push(tx(c[ci], c[ci + 1])); ci += 2; }
            else if (op === OPS.curveTo) { cur.push(tx(c[ci + 4], c[ci + 5])); ci += 6; }
            else if (op === OPS.curveTo2 || op === OPS.curveTo3) { cur.push(tx(c[ci + 2], c[ci + 3])); ci += 4; }
            else if (op === OPS.closePath) { closed = true; }
            else if (op === OPS.rectangle) {
              flush();
              const x = c[ci], y = c[ci + 1], w = c[ci + 2], h = c[ci + 3];
              ci += 4;
              addSub([tx(x, y), tx(x + w, y), tx(x + w, y + h), tx(x, y + h)], true);
            }
          }
          flush();
        }
      }
      loops.push(...this._loopsFromSegments(edges));
      // text on the page (room names) in the same coordinate space as the paths
      let labels = [];
      try {
        const tc = await page.getTextContent();
        labels = tc.items
          .filter((it) => it.str && it.str.trim())
          .map((it) => ({ text: it.str.trim(), x: it.transform[4] * mmPerUnit, y: it.transform[5] * mmPerUnit }));
      } catch (e) { /* no text layer: rooms are simply numbered */ }
      return this._buildResult(loops, { source: 'pdf', pdfScale: options.scale || 1 }, labels);
    }
    static _ensurePdfJs(options) {
      if (root.pdfjsLib) {
        this._configureWorker(options);
        return Promise.resolve(root.pdfjsLib);
      }
      const url = options.pdfJsUrl || (root.cadFloorPlanData && root.cadFloorPlanData.pdfJsUrl) || PDFJS_URL;
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = url;
        s.onload = () => { this._configureWorker(options); resolve(root.pdfjsLib); };
        s.onerror = () => reject(new Error('PDF.jsの読み込みに失敗しました。ネットワーク接続を確認してください。'));
        document.head.appendChild(s);
      });
    }
    static _configureWorker(options) {
      const w = options.pdfWorkerUrl || (root.cadFloorPlanData && root.cadFloorPlanData.pdfWorkerUrl) || PDFJS_WORKER_URL;
      root.pdfjsLib.GlobalWorkerOptions.workerSrc = w;
    }
    // --------------------------------------------------------------- JSON
    static parseJSON(text) {
      let data;
      try { data = JSON.parse(text); } catch (e) { throw new Error('JSONの形式が正しくありません: ' + e.message); }
      const rooms = Array.isArray(data) ? data : data.rooms;
      if (!Array.isArray(rooms) || !rooms.length) throw new Error('JSONに rooms 配列がありません。');
      return {
        rooms: rooms.map((r, idx) => this.normalizeRoom(r, idx)),
        metadata: Object.assign({ source: 'json' }, data.metadata || {}),
      };
    }
    // ------------------------------------------------------------ helpers
    static _addPath(pts, closed, closedLoops, openPaths) {
      if (pts.length < 2) return;
      const first = pts[0], last = pts[pts.length - 1];
      const selfClosed = pts.length >= 4 && Math.hypot(first[0] - last[0], first[1] - last[1]) < 1e-6;
      if ((closed || selfClosed) && pts.length >= 3) closedLoops.push(pts);
      else openPaths.push(pts);

        const unit = this.$('unit').value;
        const data = await CADParser.parseFloorPlan(file, { scale, unit });
        this.loadData(data, file.name, { fromFile: true, keepRoom: !!opts.keepRoom });
      } catch (err) {
        this.status('エラー: ' + err.message, 'error');
        console.error(err);
      }
    }
    loadData(data, label, opts = {}) {
      try {
        const normalized = { rooms: data.rooms.map((r, i) => CADParser.normalizeRoom(r, i)), metadata: data.metadata };
        CADParser.validate(normalized);
        if (!this.renderer) this.renderer = new ThreeRoomRenderer(this.$('canvas'));
        const prevIndex = this.roomIndex;
        const prevCount = this.data ? this.data.rooms.length : 0;
        this.data = normalized;
        this.label = label;
        this.fromFile = !!opts.fromFile;
        // with several rooms, start from the largest one; the user picks another on the plan.
        // A reload of the same drawing (scale / unit changed) keeps the room already chosen.
        let best = 0;
        normalized.rooms.forEach((r, i) => {
          if (CADParser.calculateArea(r.vertices) > CADParser.calculateArea(normalized.rooms[best].vertices)) best = i;
        });
        if (opts.keepRoom && prevCount === normalized.rooms.length && prevIndex < normalized.rooms.length) best = prevIndex;
        this.renderPicker();
        this.selectRoom(best, this.fromFile);
        const n = normalized.rooms.length;
        this.status(n > 1
          ? '部屋が ' + n + ' 室見つかりました。3Dで見たい部屋を、平面図または一覧から選んでください。'
          : '読み込みました（部屋 1）', 'success');
      } catch (err) {
        this.status('エラー: ' + err.message, 'error');
        console.error(err);
      }
    }
    selectRoom(i, reflect) {
      const room = this.data.rooms[i];
      this.roomIndex = i;
      this.renderer.loadFloorPlan({ rooms: [room], metadata: this.data.metadata });
      const b = CADParser.bounds(room.vertices);
      const a = this.renderer.getAreas();
      this.$('filename').textContent = this.label;
      this.$('room-name').textContent = room.name || ('部屋 ' + (i + 1));
      this.$('room-size').textContent = fmtMm(b.maxX - b.minX) + ' × ' + fmtMm(b.maxY - b.minY) + ' mm';
      this.$('floor-area').textContent = a.floorArea + ' ㎡';
      this.$('wall-area').textContent = a.wallArea + ' ㎡';
      this.$('room-count').textContent = this.data.rooms.length;
      this.$('unit-info').textContent = this._unitText();
      this._markSelected();
      this.syncDesigns(false);
      if (reflect && this.$('apply-size').checked) this.reflectSize(room);
      else this.$('size-note').textContent = '';
    }
    _unitText() {
      const m = this.data.metadata || {};
      if (m.unit) {
        const how = { header: '図面の設定', auto: '自動判定', manual: '手動指定', default: '既定' }[m.unit.source] || '';
        return m.unit.name + (how ? '（' + how + '）' : '');
      }
      if (m.source === 'pdf') return 'PDF 縮尺 1:' + (m.pdfScale || 1);
      return '-';
    }
    // ----------------------------------------------------------- room picker
    renderPicker() {
      const wrap = this.$('rooms');
      const rooms = this.data.rooms;
      wrap.hidden = rooms.length < 2;
      const svg = this.$('plan');
      const list = this.$('room-list');
      svg.textContent = '';
      list.textContent = '';
      if (rooms.length < 2) return;
      const all = rooms.flatMap((r) => r.vertices);
      const b = CADParser.bounds(all);
      const w = b.maxX - b.minX, h = b.maxY - b.minY;
      const pad = Math.max(w, h) * 0.04;
      // CAD Y is up, SVG Y is down
      svg.setAttribute('viewBox', [b.minX - pad, -b.maxY - pad, w + pad * 2, h + pad * 2].join(' '));
      const fs = Math.max(w, h) / (rooms.length > 12 ? 30 : 16);
      // big rooms first so that small rooms inside them stay clickable
      const order = rooms.map((r, i) => i).sort((p, q) => CADParser.calculateArea(rooms[q].vertices) - CADParser.calculateArea(rooms[p].vertices));
      order.forEach((i) => {
        const r = rooms[i];
        const g = document.createElementNS(SVG_NS, 'g');
        g.setAttribute('class', 'cfp-plan-room');
        g.setAttribute('data-i', i);
        g.setAttribute('tabindex', '0');
        g.setAttribute('role', 'button');
        g.setAttribute('aria-label', (i + 1) + ' ' + r.name);
        const poly = document.createElementNS(SVG_NS, 'polygon');
        poly.setAttribute('points', r.vertices.map(([x, y]) => x + ',' + -y).join(' '));
        const title = document.createElementNS(SVG_NS, 'title');
        const rb = CADParser.bounds(r.vertices);
        title.textContent = (i + 1) + '. ' + r.name + '（' + fmtM(rb.maxX - rb.minX) + '×' + fmtM(rb.maxY - rb.minY) + 'm）';
        const text = document.createElementNS(SVG_NS, 'text');
        text.setAttribute('x', (rb.minX + rb.maxX) / 2);
        text.setAttribute('y', -(rb.minY + rb.maxY) / 2);
        // keep the number inside small rooms
        text.setAttribute('font-size', Math.min(fs, Math.min(rb.maxX - rb.minX, rb.maxY - rb.minY) / 2));
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('dominant-baseline', 'central');
        text.textContent = i + 1;
        g.append(poly, title, text);
        g.addEventListener('click', () => this._pick(i));
        g.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this._pick(i); } });
        svg.appendChild(g);
      });
      rooms.forEach((r, i) => {
        const rb = CADParser.bounds(r.vertices);
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'cfp-room-btn';
        btn.setAttribute('data-i', i);
        const num = document.createElement('span');
        num.className = 'cfp-room-num';
        num.textContent = i + 1;
        const name = document.createElement('span');
        name.className = 'cfp-room-name';
        name.textContent = r.name;
        const meta = document.createElement('span');
        meta.className = 'cfp-room-meta';
        meta.textContent = fmtM(rb.maxX - rb.minX) + '×' + fmtM(rb.maxY - rb.minY) + 'm / ' + fmtArea(CADParser.calculateArea(r.vertices)) + '㎡';
        btn.append(num, name, meta);
        btn.addEventListener('click', () => this._pick(i));
        list.appendChild(btn);
      });
    }
    _pick(i) {
      this.selectRoom(i, this.fromFile);
      this.status('「' + (this.data.rooms[i].name) + '」を表示しています。', 'success');
    }
    _markSelected() {
      this.el.querySelectorAll('.cfp-plan-room, .cfp-room-btn').forEach((n) => {
        const on = Number(n.getAttribute('data-i')) === this.roomIndex;
        n.classList.toggle('is-selected', on);
        if (n.tagName === 'BUTTON') n.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    }
    // ------------------------------------------------- size -> estimate / perspective
    _setField(el, v) {
      el.value = v;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
    }
    /**
     * Writes the selected room's size into the estimate tool (carpet W x H, rounded up to the
     * 500 mm tile) and the room perspective (width / floor depth / wall height).
     */
    reflectSize(room) {
      const note = this.$('size-note');
      const ccW = document.getElementById('cc-width');
      const ccH = document.getElementById('cc-height');
      if (!ccW || !ccH) { note.textContent = ''; return; }
      const b = CADParser.bounds(room.vertices);
      const w = b.maxX - b.minX, h = b.maxY - b.minY;
      // round up to the 500 mm tile, but ignore drawing noise of up to 10 mm
      const tiles = (mm) => Math.max(500, Math.ceil((mm - 10) / 500) * 500);
      const tileW = tiles(w);
      const tileH = tiles(h);
      this._setField(ccW, tileW);
      this._setField(ccH, tileH);
      const wallH = Math.max(...room.walls.map((x) => x.height || CADParser.DEFAULT_WALL_HEIGHT));
      let clamped = false;
      const persp = { 'persp-width': w, 'persp-floor-depth': h, 'persp-wall-height': wallH };
      const applied = {};
      Object.keys(persp).forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        const min = parseFloat(el.min) || 0, max = parseFloat(el.max) || Infinity;
        const v = Math.min(max, Math.max(min, Math.round(persp[id] / 50) * 50));
        if (v !== Math.round(persp[id] / 50) * 50) clamped = true;
        applied[id] = v;
        this._setField(el, v);
      });
      const area = CADParser.calculateArea(room.vertices);
      let text = '図面から「' + (room.name || '部屋') + '」のサイズ ' + fmtMm(w) + '×' + fmtMm(h) + ' mm を読み取り、'
        + 'カーペットを ' + fmtMm(tileW) + '×' + fmtMm(tileH) + ' mm（500mm単位に切り上げ。10mm以下の端数は切り捨て）、'
        + 'お部屋パースを 幅' + fmtMm(applied['persp-width'] || w) + '／奥行' + fmtMm(applied['persp-floor-depth'] || h)
        + '／壁の高さ' + fmtMm(applied['persp-wall-height'] || wallH) + ' mm に設定しました。';
      if (Math.abs(area - w * h) / (w * h) > 0.01) {
        text += ' ※四角でない部屋のため、見積もりは外接する四角（' + fmtArea(tileW * tileH) + '㎡）で計算されます（実際の床面積は ' + fmtArea(area) + '㎡）。';
      }
      if (clamped) text += ' ※パースの寸法は入力欄の上限・下限に丸めました。';
      note.textContent = text;
    }
    /**
     * On the wallpaper/carpet simulator page, shows the converted (reduced-colour) floor and
     * wallpaper designs from #cc-reduced / #cw-reduced on the 3D floor and walls.
     * fromEvent: the tool re-processed a design, so an emptied canvas clears the texture too.
     */
    syncDesigns(fromEvent) {
      const floor = document.getElementById('cc-reduced');
      const wall = document.getElementById('cw-reduced');
      const note = this.$('design-note');
      if (!this.renderer || (!floor && !wall)) return;
      const hasFloor = !!floor && floor.width > 0 && floor.height > 0 && canvasHasContent(floor);
      const hasWall = !!wall && wall.width > 0 && wall.height > 0 && canvasHasContent(wall);
      if (hasFloor || fromEvent) this.renderer.setFloorCanvas(hasFloor ? floor : null);
      if (hasWall || fromEvent) this.renderer.setWallCanvas(hasWall ? wall : null);
      if (!note) return;
      if (hasFloor && hasWall) note.textContent = '床・壁のデザイン（変換後の画像）を反映しています。';
      else if (hasFloor) note.textContent = '床のデザインを反映しています。壁は「② 壁紙用デザイン」を処理すると反映されます。';
      else if (hasWall) note.textContent = '壁のデザインを反映しています。床は「① カーペット用デザイン」を処理すると反映されます。';
      else note.textContent = '①カーペット用・②壁紙用のデザイン画像を処理すると、床・壁に自動で反映されます。';
    }
    _texture(e, kind) {
      const f = e.target.files[0];
      if (!f) return;
      if (!this.renderer) return this.status('先に間取りを読み込んでください。', 'error');
      const url = URL.createObjectURL(f);
      if (kind === 'floor') this.renderer.setFloorTexture(url);
      else this.renderer.setWallTexture(url);
    }
    saveJSON() {
      if (!this.data) return;
      const blob = new Blob([JSON.stringify(this.data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'floor-plan.json';
      a.click();
      URL.revokeObjectURL(a.href);
    }
    status(msg, type) {
      const s = this.$('status');
      s.textContent = msg;
      s.className = 'cfp-status cfp-status-' + type;
    }
  }
  function init() {
    document.querySelectorAll('.cad-floor-plan-widget').forEach((el) => {
      if (!el.cfpWidget) el.cfpWidget = new CADFloorPlanWidget(el);
    });
  }
  window.initCADFloorPlan = init;
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
